<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le QG des Daronnes</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff9142">
    <link rel="apple-touch-icon" href="logo-qgd.png?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f7f6f4;
            --card-bg: #ffffff;
            --avatar-card-bg: #ffffff;
            --text: #080808;
            --primary: #ff9142;
            --primary-transparent: rgba(255, 145, 66, 0.82);
            --border: #dfe4ea;
            --shadow: rgba(0,0,0,0.05);
        }
        [data-theme="dark"] {
            --bg: #1e1e24;
            --card-bg: #2d2d38;
            --avatar-card-bg: #1e1e24;
            --text: #f1f2f6;
            --primary: #ff9142;
            --primary-transparent: rgba(255, 145, 66, 0.82);
            --border: #3f3f4e;
            --shadow: rgba(0,0,0,0.3);
        }

        * , *::before, *::after {
            box-sizing: border-box;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 12px;
            padding-bottom: 84px;
            transition: background 0.3s, color 0.3s;
        }

        /* Écran de Connexion */
        #login-screen {
            width: min(350px, 100%);
            margin: 40px auto;
            text-align: center;
            background: var(--card-bg);
            padding: 20px 16px;
            border-radius: 16px;
            box-shadow: 0 8px 16px var(--shadow);
        }
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }
        .avatar-card {
            background: var(--avatar-card-bg);
            border: 2px solid var(--border);
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .avatar-card:hover {
            background: var(--avatar-card-bg);
            color: var(--text);
            border-color: var(--avatar-color, var(--primary));
            transform: translateY(-2px);
        }
        .avatar-card:hover .avatar-icon {
            animation: avatar-bob 0.6s ease-in-out infinite;
        }

        /* Icône avatar animée (visage qui cligne des yeux + flotte) */
        .avatar-icon {
            width: 48px;
            height: 48px;
            animation: avatar-float 3s ease-in-out infinite;
        }
        .avatar-icon .eye {
            animation: avatar-blink 4s ease-in-out infinite;
            transform-origin: center;
            transform-box: fill-box;
        }
        @keyframes avatar-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        @keyframes avatar-bob {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-3px) rotate(-3deg); }
        }
        @keyframes avatar-blink {
            0%, 88%, 100% { transform: scaleY(1); }
            92% { transform: scaleY(0.1); }
        }

        /* Icône soleil/lune animée pour le bouton thème */
        .theme-icon {
            position: relative;
            width: 24px;
            height: 24px;
            display: inline-block;
            vertical-align: middle;
        }
        .theme-icon svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transition: opacity 0.4s ease, transform 0.5s ease;
        }
        .icon-sun {
            opacity: 1;
            transform: rotate(0deg) scale(1);
            animation: sun-pulse 3s ease-in-out infinite;
        }
        .icon-moon {
            opacity: 0;
            transform: rotate(-90deg) scale(0.6);
        }
        [data-theme="dark"] .icon-sun {
            opacity: 0;
            transform: rotate(90deg) scale(0.6);
            animation: none;
        }
        [data-theme="dark"] .icon-moon {
            opacity: 1;
            transform: rotate(0deg) scale(1);
            animation: moon-twinkle 2.5s ease-in-out infinite;
        }
        @keyframes sun-pulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.25); }
        }
        @keyframes moon-twinkle {
            0%, 100% { filter: drop-shadow(0 0 0px currentColor); }
            50% { filter: drop-shadow(0 0 3px currentColor); }
        }
        #theme-toggle-btn.spin .theme-icon {
            animation: spin-once 0.5s ease;
        }
        @keyframes spin-once {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Application principale */
        #app-screen {
            display: none;
            width: min(350px, 100%);
            margin: 0 auto;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            position: sticky;
            top: 0;
            background: var(--bg);
            padding: 8px 0;
            z-index: 5;
        }
        .top-bar-title {
            font-weight: bold;
            font-size: 1.25rem;
            color: var(--primary);
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin: 0;
        }
        .top-bar-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .top-bar button {
            flex-shrink: 0;
        }
        .top-bar button {
            background: transparent;
            border: none;
            font-size: 1.3rem;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .top-bar button:hover {
            background: transparent;
            color: var(--primary);
        }

        /* Menu latéral */
        .menu-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 20;
        }
        .menu-overlay.open { display: block; }
        .menu-drawer {
            position: fixed;
            top: 0;
            left: 50%;
            width: min(350px, 100%);
            max-height: 85vh;
            overflow-y: auto;
            background: var(--card-bg);
            box-shadow: 0 10px 24px var(--shadow);
            transform: translate(-50%, -100%);
            transition: transform 0.3s ease;
            z-index: 21;
            padding: 20px;
            box-sizing: border-box;
            border-radius: 0 0 16px 16px;
        }
        .menu-drawer.open { transform: translate(-50%, 0); }
        .menu-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding-bottom: 16px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .menu-header .avatar-icon { width: 36px; height: 36px; margin: 0; }
        .menu-header span { font-weight: bold; }
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            text-align: center;
            background: none;
            border: none;
            padding: 12px 4px;
            font-weight: 600;
            text-decoration: none;
            color: var(--text);
            cursor: pointer;
            box-sizing: border-box;
        }
        .menu-item:hover {
            background: var(--bg);
            color: var(--primary);
            border-radius: 8px;
        }
        .menu-item svg { flex-shrink: 0; }

        /* Barre de navigation du bas */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: min(350px, 100%);
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            border-top: 1px solid var(--border);
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
            z-index: 10;
        }
        .bottom-nav button {
            flex: 1;
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 0.65rem;
            color: var(--text);
            opacity: 0.55;
            padding: 4px 10px;
        }
        .bottom-nav button:hover {
            background: none;
            color: var(--text);
        }
        .bottom-nav button .nav-icon { font-size: 1.3rem; }
        .bottom-nav button svg.nav-icon {
            width: 22px;
            height: 22px;
            display: block;
            margin: 0 auto 2px;
        }
        .bottom-nav button.active-nav {
            opacity: 1;
            color: var(--primary);
        }
        button {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
        }
        button:hover {
            background: var(--primary);
            color: #080808;
            border-color: var(--primary);
        }
        button.active-view {
            background: var(--primary);
            color: #080808;
            border-color: var(--primary);
        }

        /* espace réservé aux vues */

        /* Cartes de soirées */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px var(--shadow);
            border: 1px solid var(--border);
            transition: box-shadow 0.3s, border-color 0.3s;
        }
        .card.highlight-flash {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary);
        }
        .date-header {
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }
        .status-global {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: bold;
        }
        .status-blocked { background: #ffd9d9; color: #a32d2d; }
        .status-pending { background: var(--border); color: var(--text); opacity: 0.8; }
        .status-free-kids { background: #d6ecff; color: #185fa5; }
        .status-free { background: #d7f5e3; color: #0f6e56; }

        /* Boutons ronds des participantes */
        .participants-row {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
            gap: 14px;
        }
        .slot-label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 4px;
        }
        .participant-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75rem;
        }
        .round-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-top: 4px;
            transition: transform 0.1s, opacity 0.2s;
        }
        .round-btn:active {
            transform: scale(0.9);
        }
        .round-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
        .round-btn.saving {
            opacity: 0.5;
        }
        /* Pastilles d'état : la couleur = la personne (fixe, celle de son avatar),
           la FORME/le remplissage = son statut de dispo.
           - Pas répondu : rond gris
           - Dispo : rond coloré (couleur de la personne)
           - Dispo - enfants : triangle coloré (couleur de la personne)
           - Indispo : rond avec une croix de la couleur de la personne */
        .round-btn.state-inconnu { background: var(--border); border-radius: 50%; }
        .round-btn.state-dispo { background: var(--pastille-color, var(--border)); border-radius: 50%; }
        .round-btn.state-enfants { background: transparent; border-radius: 50%; }
        .round-btn.state-indispo { background: transparent; border-radius: 50%; }
        .pastille-cross { display: block; }

        /* Pastilles de PARTICIPATION à une soirée/journée proposée (distinctes
           des pastilles de dispo générale : rond avec un ✓, une ✕ ou un "?") */
        .round-btn.part-inconnu { background: var(--border); border-radius: 50%; }
        .round-btn.part-oui { background: var(--pastille-color, var(--border)); border-radius: 50%; }
        .round-btn.part-non { background: transparent; border-radius: 50%; }
        .participation-row { margin-top: 6px; }

        /* Mini-pastilles utilisées dans la vue calendrier (taille réduite pour
           que les 7 colonnes tiennent toujours sur la largeur de l'écran :
           seul le défilement vertical est nécessaire, jamais horizontal) */
        .mini-pastille-row {
            display: flex;
            gap: 1px;
            justify-content: center;
        }
        .mini-pastille {
            width: 6px;
            height: 6px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mini-pastille.state-inconnu { background: var(--border); border-radius: 50%; }
        .mini-pastille.state-dispo { background: var(--pastille-color, var(--border)); border-radius: 50%; }
        .mini-pastille.state-enfants { background: transparent; border-radius: 50%; overflow: visible; }
        .mini-pastille.state-indispo { background: transparent; border-radius: 50%; overflow: visible; }

        /* Calendrier mensuel */
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .calendar-nav span {
            font-weight: bold;
            text-transform: capitalize;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            overflow-x: hidden;
        }
        .calendar-day-header {
            text-align: center;
            font-size: 0.65rem;
            font-weight: bold;
            color: var(--primary);
            padding-bottom: 4px;
        }
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.8rem;
            position: relative;
            cursor: default;
        }
        .calendar-day {
            aspect-ratio: unset;
            min-height: 58px;
            padding: 3px 1px;
            gap: 2px;
            overflow: hidden;
        }
        .calendar-day.empty {
            border: none;
            min-height: 58px;
        }
        .calendar-day.has-event {
            cursor: pointer;
            border-color: var(--border);
            font-weight: bold;
        }
        .calendar-day.has-event:hover {
            border-color: var(--primary);
        }
        .calendar-day.selected-day {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary);
        }
        .calendar-day .day-number-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }
        .calendar-day .holiday-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--primary);
            flex-shrink: 0;
        }
        #calendar-day-detail {
            margin-top: 16px;
        }
        .calendar-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.68rem;
            opacity: 0.75;
            margin-top: 10px;
            justify-content: center;
        }
        .calendar-legend span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .calendar-legend .holiday-dot {
            width: 6px; height: 6px; border-radius: 50%; background: var(--primary);
        }
        .calendar-day.on-vacances {
            background: rgba(255, 94, 58, 0.07);
        }
        [data-theme="dark"] .calendar-day.on-vacances {
            background: rgba(255, 145, 66, 0.12);
        }
        .calendar-legend .vac-swatch {
            width: 10px; height: 10px; border-radius: 3px; background: rgba(255, 94, 58, 0.2);
        }

        /* Page d'accueil */
        .home-banner {
            position: relative;
            width: 350px;
            height: 200px;
            max-width: 100%;
            border-radius: 16px;
            overflow: hidden;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--primary), #ffb199);
        }
        .home-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .home-banner-scrim {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.2) 55%, rgba(0,0,0,0.05) 100%);
            pointer-events: none;
        }
        .home-greeting {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 10px 14px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #fff;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.7);
            max-width: 95%;
            text-align: center;
            white-space: nowrap;
        }
        .home-greeting .avatar-icon {
            width: 44px;
            height: 44px;
            margin: 0;
            animation: none;
            flex-shrink: 0;
        }
        .overview-label {
            text-transform: uppercase;
            font-size: 0.7rem;
            color: var(--primary);
            font-weight: bold;
            letter-spacing: 0.5px;
            text-align: center;
        }
        .overview-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 4px 0 12px;
        }
        .overview-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }
        .overview-row:last-child { border-bottom: none; }
        .overview-row .day-name { font-weight: bold; }
        .overview-row .day-people { font-size: 0.85rem; opacity: 0.75; margin-top: 2px; }
        .overview-row .chevron { opacity: 0.35; font-size: 1.1rem; }
        .next-available-card {
            text-align: center;
            padding: 18px;
        }
        .next-available-card .label {
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 0.7rem;
        }
        .next-available-card .value {
            font-size: 1.1rem;
            font-weight: bold;
        }
        .whatsapp-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
            color: var(--text);
            font-weight: bold;
            text-decoration: none;
            padding: 10px 16px;
        }

        .btn-orange {
            background: var(--primary);
            color: #080808;
            border-radius: 10px;
            padding: 12px;
            margin-top: 8px;
        }
        .btn-orange:hover {
            background: var(--primary);
            opacity: 0.9;
        }

        /* Interface de chargement */
        .loading-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 70px 20px;
        }
        .pour-anim {
            width: 225px;
            height: 137px;
            transform: translateX(-16px);
        }
        .pour-anim .bottle-group {
            transform-origin: 125px 195px;
            animation: bottle-tilt 6.5s ease-in-out infinite;
        }
        @keyframes bottle-tilt {
            0%, 100% { transform: rotate(34deg); }
            50% { transform: rotate(39deg); }
        }
        .pour-anim .droplet {
            opacity: 0;
            animation: droplet-fall 6.5s ease-in-out infinite;
        }
        .pour-anim .droplet:nth-child(2) { animation-delay: 0.3s; }
        .pour-anim .droplet:nth-child(3) { animation-delay: 0.6s; }
        .pour-anim .droplet:nth-child(4) { animation-delay: 0.9s; }
        .pour-anim .droplet:nth-child(5) { animation-delay: 1.2s; }
        .pour-anim .droplet:nth-child(6) { animation-delay: 1.5s; }
        .pour-anim .droplet:nth-child(7) { animation-delay: 1.8s; }
        .pour-anim .droplet:nth-child(8) { animation-delay: 2.1s; }
        .pour-anim .droplet:nth-child(9) { animation-delay: 2.4s; }
        @keyframes droplet-fall {
            0% { opacity: 0; transform: translate(0, 0); }
            2.46% { opacity: 1; }
            19.69% { opacity: 1; transform: translate(10px, 45px); }
            24.6% { opacity: 0; transform: translate(11px, 47px); }
            100% { opacity: 0; transform: translate(11px, 47px); }
        }
        .pour-anim .liquid-fill {
            animation: liquid-rise 6.5s cubic-bezier(.45,0,.2,1) infinite;
        }
        @keyframes liquid-rise {
            0% { height: 0; y: 182px; opacity: 0; }
            0.5% { opacity: 1; }
            61.538% { height: 26px; y: 156px; opacity: 1; }
            92.308% { height: 26px; y: 156px; opacity: 1; }
            100% { height: 26px; y: 156px; opacity: 0; }
        }
        .loading-text {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            color: var(--text);
            opacity: 0.85;
            text-align: center;
        }

        /* Pop-up de saisie du code PIN */
        .pin-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 30;
        }
        .pin-overlay.open { display: block; }
        .pin-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(280px, 85vw);
            background: var(--card-bg);
            border-radius: 20px;
            padding: 28px 24px;
            box-shadow: 0 16px 32px var(--shadow);
            z-index: 31;

        /* Pop-up de confirmation de soirée (motif) */

            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 30;

        /* Pop-up FAQ */

            display: none;

            top: 50%;
            left: 50%;

        .faq-title-row {

            justify-content: space-between;

            font-size: 0.8rem;
            line-height: 1.5;
            margin: 0;

        .faq-section .faq-body {
            font-size: 0.8rem;
            line-height: 1.5;
            opacity: 0.9;
        }

            margin: 4px 0 0;
            padding-left: 18px;

            line-height: 1.5;

        /* Barre de soirée/journée proposée (grise) ou confirmée (segments colorés) */
        .proposal-bar-wrap {
            border-radius: 10px;

            margin-top: 12px;
            margin-bottom: 10px;
            border: 1px solid var(--border);

            height: 7px;

            font-size: 0.83rem;
            font-weight: bold;

            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }
        .proposal-bar-wrap.is-grey .proposal-bar-body {
            background: var(--bg);
            color: var(--text);
            opacity: 0.9;
        }
        .proposal-bar-wrap.is-confirmed .proposal-bar-body {
            background: #e6f1fb;
            color: #0c447c;
        }
        [data-theme="dark"] .proposal-bar-wrap.is-confirmed .proposal-bar-body {
            background: #1c3550;
            color: #bcdcfa;
        }
        .proposal-bar-body button {
            background: none;
            border: none;
            font-size: 0.72rem;
            padding: 2px 6px;
            font-weight: bold;

            color: inherit;

            background: none;
            color: inherit;

        .proposal-bar-warning {
            font-weight: 600;
            font-size: 0.78rem;
        }

        /* Badges "proposée" / "confirmée" à côté de la date */
        .extra-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .badge-proposed, .badge-confirmed {
            font-size: 0.68rem;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: bold;
            white-space: nowrap;
        }
        .badge-proposed { background: var(--border); color: var(--text); opacity: 0.85; }
        .badge-confirmed { background: #e6f1fb; color: #0c447c; }
        [data-theme="dark"] .badge-confirmed { background: #1c3550; color: #bcdcfa; }

        /* Heures de début/fin dans la pop-up de proposition */
        .time-row { display: flex; gap: 10px; margin-bottom: 12px; }
        .time-field { flex: 1; text-align: left; }

        .time-field input { margin-bottom: 0 !important; }

        .poll-field { text-align: left; margin-bottom: 12px; }
        .poll-field label { display: block; font-size: 0.75rem; font-weight: 600; opacity: 0.7; margin-bottom: 4px; }
        .confirm-modal select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border-radius: 12px;

            color: var(--text);

        /* Bloc d'une proposition (plusieurs possibles par jour) */
        .prop-block { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--border); }
        .prop-title { font-weight: 700; font-size: 0.88rem; margin-bottom: 4px; text-align: center; }
        .prop-block .proposal-bar-wrap { margin-top: 12px; }

        /* Lien SMS */
        .sms-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: var(--text);
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .sms-link-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .confirm-btn-wrap {
            text-align: center;
            margin-top: 12px;
        }
        .btn-subtle {
            background: transparent;
            color: var(--text);
            opacity: 0.6;
            border: 1px dashed var(--border);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 6px 12px;
        }
        .btn-subtle:hover {
            background: transparent;
            color: var(--text);
            border-color: var(--border);
            opacity: 0.85;
        }

        /* Titres : Fraunces (chaleureux + sérieux), reste en Inter */
        #login-screen h1,
        .top-bar-title,
        .home-greeting span,
        .overview-title,
        .calendar-nav span {
            font-family: 'Fraunces', serif;
            text-align: center;
        }

        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .search-input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }
        .search-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Bouton remonter en haut */
        .scroll-top-btn {
            position: fixed;
            right: 16px;
            bottom: 84px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--primary-transparent);
            color: #080808;
            border: 2px solid #3a3a3a;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px var(--shadow);
            z-index: 15;
            padding: 0;
            font-size: 1.1rem;
        }
        .scroll-top-btn:hover {
            background: var(--primary-transparent);
            opacity: 0.9;
        }

        .overview-row:focus-visible,
        .calendar-day.has-event:focus-visible,
        .avatar-card:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* Notifications toast (remplacent les alert() du navigateur) */
        .toast-container {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: min(300px, 90vw);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 40;
            pointer-events: none;
        }
        .toast {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            border-radius: 10px;
            padding: 10px 14px;
            box-shadow: 0 6px 16px var(--shadow);
            font-size: 0.85rem;
            color: var(--text);
            animation: toast-in 0.25s ease;
            transition: opacity 0.3s ease;
        }
        .toast.toast-error { border-left-color: #e24b4a; }
        .toast.toast-warn { border-left-color: #eccc68; }
        @keyframes toast-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

    <script>
        // ==========================================================
        // CONFIGURATION
        // ==========================================================

        // URL de lecture (export CSV public du Google Sheet)
        // (Ancienne lecture via CSV publié, remplacée par la lecture live via
        // Apps Script — voir loadPlanning() plus bas. Conservé en commentaire
        // au cas où : "https://docs.google.com/spreadsheets/d/e/.../pub?output=csv")

        // ⚠️ A REMPLACER : URL du déploiement Apps Script (se termine par /exec)
        // Déploie Code.gs en Application Web puis colle l'URL ici.
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxo9A_3guPcgwsDo0V_zbReyfQtrZoEF5QI40ETHSmURFaP9bIYHb3HlaLbrfwGpkrc/exec";

        // 🖼️ Bannière de la page d'accueil : mets ici le chemin/URL de la photo
        // (ex: "images/banniere.jpg" si tu ajoutes le fichier dans ton repo GitHub).
        // Laisse vide "" pour un dégradé de couleur à la place.
        const HOME_BANNER_URL = "https://picsum.photos/350/200";

        // 💬 Lien vers le groupe WhatsApp (menu + page d'accueil)
        const WHATSAPP_URL = "https://chat.whatsapp.com/Gb2c0ayE9v9DhASPU4MQsb";

        // 🔗 A REMPLACER : URL publique de l'appli (ex: ton lien Netlify), utilisée
        // dans les messages WhatsApp envoyés pour prévenir le groupe.
        const APP_URL = "https://qg-daronnes.netlify.app";
        // (protection simple entre vous, pas une vraie sécurité)
        const PEOPLE = [
            { display: "Anaïs",        short: "Anaïs",    key: "anais",       column: "Anais",       columnJournee: "Anais_Journee",       columnParticipe: "Anais_Participe",       columnParticipeJournee: "Anais_ParticipeJournee",       pin: "1111", color: "#26de81" },
            { display: "Anne-Sophie",  short: "Anne-So",  key: "anneSophie",  column: "AnneSophie",  columnJournee: "AnneSophie_Journee",  columnParticipe: "AnneSophie_Participe",  columnParticipeJournee: "AnneSophie_ParticipeJournee",  pin: "2222", color: "#b376ed" },
            { display: "Céline",       short: "Céline",   key: "celine",      column: "Celine",      columnJournee: "Celine_Journee",      columnParticipe: "Celine_Participe",      columnParticipeJournee: "Celine_ParticipeJournee",      pin: "3333", color: "#ff6b81" },
            { display: "Sonia",        short: "Sonia",    key: "sonia",       column: "Sonia",       columnJournee: "Sonia_Journee",       columnParticipe: "Sonia_Participe",       columnParticipeJournee: "Sonia_ParticipeJournee",       pin: "4444", color: "#feca57" }
        ];

        // 🇫🇷 Jours fériés France (codés en dur, 2026-2028).
        // ⚠️ A METTRE A JOUR EN AOUT 2027 (ajouter 2029 et vérifier les dates
        // à Pâques variable de 2027/2028 avant leur passage).
        const JOURS_FERIES = [
            "2026-01-01","2026-04-06","2026-05-01","2026-05-08","2026-05-14","2026-05-25","2026-07-14","2026-08-15","2026-11-01","2026-11-11","2026-12-25",
            "2027-01-01","2027-03-29","2027-05-01","2027-05-06","2027-05-08","2027-05-17","2027-07-14","2027-08-15","2027-11-01","2027-11-11","2027-12-25",
            "2028-01-01","2028-04-17","2028-05-01","2028-05-08","2028-05-25","2028-06-05","2028-07-14","2028-08-15","2028-11-01","2028-11-11","2028-12-25"
        ];

        // 🏖️ Vacances scolaires Zone A (Besançon en fait partie), codées en dur.
        // Chaque entrée est une plage [début, fin] inclusive au format ISO.
        // ⚠️ A METTRE A JOUR EN AOUT 2027 (source : education.gouv.fr, zone A).
        const VACANCES_ZONE_A = [
            { start: "2026-02-14", end: "2026-03-02" }, // Hiver
            { start: "2026-04-11", end: "2026-04-27" }, // Printemps
            { start: "2026-07-04", end: "2026-09-01" }, // Été
            { start: "2026-10-17", end: "2026-11-02" }, // Toussaint
            { start: "2026-12-19", end: "2027-01-04" }, // Noël
            { start: "2027-02-13", end: "2027-03-01" }, // Hiver
            { start: "2027-04-10", end: "2027-04-26" }, // Printemps
            { start: "2027-07-03", end: "2027-08-31" }, // Été
            { start: "2027-10-16", end: "2027-11-01" }, // Toussaint
            { start: "2027-12-18", end: "2028-01-03" }, // Noël
            { start: "2028-02-12", end: "2028-02-28" }, // Hiver
            { start: "2028-04-08", end: "2028-04-24" }, // Printemps
            { start: "2028-07-08", end: "2028-09-04" }  // Été (jusqu'à fin déc 2028 non couvert au-delà)
        ];

        function isoDateStr_(d) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
        }

        function isJourFerie(d) {
            if (!d) return false;
            return JOURS_FERIES.includes(isoDateStr_(d));
        }

        function isVacancesZoneA(d) {
            if (!d) return false;
            const iso = isoDateStr_(d);
            return VACANCES_ZONE_A.some(r => iso >= r.start && iso <= r.end);
        }

        // ==========================================================
        // ETAT
        // ==========================================================
        let currentUser = "";
        let currentTab = "accueil"; // 'accueil' | 'liste' | 'idee'
        let currentView = "list";   // sous-vue de l'onglet Liste : 'list' | 'calendar'
        let planningData = [];
        let propositionsData = []; // événements proposés (plusieurs possibles par jour)
        let calYear = new Date().getFullYear();
        let calMonth = new Date().getMonth(); // 0-11
        let selectedCalendarKey = null; // date ISO du jour sélectionné dans la vue calendrier (reste affiché tant qu'on ne clique pas un autre jour)
        let listSearchQuery = "";
        let listVisibleCount = 20;
        let pendingPinPerson = null;

        // ==========================================================
        // LOGIN / LOGOUT
        // ==========================================================
        function buildLoginScreen() {
            const grid = document.getElementById("avatar-grid");
            grid.innerHTML = "";
            PEOPLE.forEach(p => {
                const div = document.createElement("button");
                div.type = "button";
                div.className = "avatar-card";
                div.setAttribute("aria-label", `Se connecter en tant que ${p.display}`);
                div.style.setProperty("--avatar-color", p.color);
                div.innerHTML = `
                    <svg class="avatar-icon" viewBox="0 0 48 48" aria-hidden="true">${avatarSvgInner(p)}</svg>
                    <span>${p.display}</span>
                `;
                div.onclick = () => attemptLogin(p);
                grid.appendChild(div);

                // Décalage aléatoire pour que les avatars ne bougent pas tous en même temps
                const delay = (Math.random() * 2).toFixed(2) + "s";
                div.querySelector(".avatar-icon").style.animationDelay = delay;
                div.querySelectorAll(".eye").forEach(eye => eye.style.animationDelay = delay);
            });
        }

        let pinTriggerEl = null;

        function attemptLogin(person) {
            pendingPinPerson = person;
            pinTriggerEl = document.activeElement;
            document.getElementById("pin-avatar-icon").innerHTML = avatarSvgInner(person);
            document.getElementById("pin-input").value = "";
            document.getElementById("pin-error").textContent = "";
            document.getElementById("pin-overlay").classList.add("open");
            document.getElementById("pin-modal").classList.add("open");
            setTimeout(() => document.getElementById("pin-input").focus(), 50);
        }

        function closePinModal(returnFocus = true) {
            document.getElementById("pin-overlay").classList.remove("open");
            document.getElementById("pin-modal").classList.remove("open");
            pendingPinPerson = null;
            const elToFocus = pinTriggerEl;
            pinTriggerEl = null;
            if (returnFocus && elToFocus) {
                // Décalé au tick suivant : évite que le relâchement de la touche
                // Entrée (keyup), une fois le focus revenu sur ce bouton, ne soit
                // interprété par le navigateur comme un nouveau clic dessus.
                setTimeout(() => elToFocus.focus(), 0);
            }
        }

        function submitPin() {
            if (!pendingPinPerson) return;
            const input = document.getElementById("pin-input");
            if (input.value.trim() === pendingPinPerson.pin) {
                const person = pendingPinPerson;
                closePinModal(false);
                login(person.display);
            } else {
                document.getElementById("pin-error").textContent = "Code incorrect, réessaie.";
                input.value = "";
                input.focus();
            }
        }

        // ==========================================================
        // SOIRÉE / JOURNÉE CONFIRMÉE
        // ==========================================================
        let pendingConfirmIndex = null;
        let pendingEditId = null; // id de la proposition en cours de modification (sinon : ajout)
        let confirmTriggerEl = null;

        function openConfirmModal(index) {
            pendingConfirmIndex = index;
            confirmTriggerEl = document.activeElement;
            const item = planningData[index];
            document.getElementById("confirm-title-text").textContent = `Proposer un événement — ${item.jour} ${item.date}`;
            document.getElementById("confirm-input").value = "";
            document.getElementById("confirm-start").value = "20:00";
            document.getElementById("confirm-end").value = "23:00";
            document.getElementById("confirm-submit-btn").textContent = "Proposer";
            document.getElementById("confirm-poll").innerHTML = buildPollOptions_();
            document.getElementById("confirm-poll-wrap").style.display = "block";
            document.getElementById("confirm-overlay").classList.add("open");
            document.getElementById("confirm-modal").classList.add("open");
            setTimeout(() => document.getElementById("confirm-input").focus(), 50);
        }

        // Même pop-up, pré-remplie, pour modifier le motif et/ou les horaires.
        function openEditModal(propId) {
            const prop = propositionsData.find(p => p.id === propId);
            if (!prop) return;
            if (propId.startsWith("tmp-")) {
                showToast("Un instant, l'événement est en cours d'enregistrement…", "warn");
                return;
            }
            pendingEditId = propId;
            pendingConfirmIndex = null;
            confirmTriggerEl = document.activeElement;
            document.getElementById("confirm-title-text").textContent = "Modifier l'événement";
            document.getElementById("confirm-input").value = prop.motif;
            document.getElementById("confirm-start").value = prop.debut;
            document.getElementById("confirm-end").value = prop.fin;
            document.getElementById("confirm-submit-btn").textContent = "Enregistrer";
            document.getElementById("confirm-poll-wrap").style.display = "none";
            document.getElementById("confirm-overlay").classList.add("open");
            document.getElementById("confirm-modal").classList.add("open");
            setTimeout(() => document.getElementById("confirm-input").focus(), 50);
        }

        function closeConfirmModal() {
            document.getElementById("confirm-overlay").classList.remove("open");
            document.getElementById("confirm-modal").classList.remove("open");
            pendingConfirmIndex = null;
            pendingEditId = null;
            const elToFocus = confirmTriggerEl;
            confirmTriggerEl = null;
            if (elToFocus) setTimeout(() => elToFocus.focus(), 0);
        }

        async function submitConfirm() {
            if (pendingConfirmIndex === null && pendingEditId === null) return;
            const motif = document.getElementById("confirm-input").value.trim();
            const debut = document.getElementById("confirm-start").value;
            const fin = document.getElementById("confirm-end").value;
            if (!motif) {
                showToast("Ajoute un petit motif.", "warn");
                return;
            }
            if (!debut || !fin) {
                showToast("Indique l'heure de début et de fin.", "warn");
                return;
            }
            if (debut === fin) {
                showToast("L'heure de fin doit être différente du début.", "warn");
                return;
            }
            if (pendingEditId !== null) {
                const id = pendingEditId;
                closeConfirmModal();
                await updateProposition(id, debut, fin, motif);
                return;
            }
            const item = planningData[pendingConfirmIndex];
            const d = parseDate(item.date);
            let sondage = document.getElementById("confirm-poll").value;
            if (sondage === "new") sondage = "S" + Date.now().toString(36);
            closeConfirmModal();
            await addProposition(isoDateStr_(d), debut, fin, motif, sondage);
        }

        // ----- Propositions d'événements (plusieurs possibles le même jour) -----
        function propsForDate_(iso) {
            return propositionsData
                .filter(p => p.date === iso)
                .sort((a, b) => a.debut.localeCompare(b.debut));
        }

        function formatPropTime_(prop) {
            return `${prop.debut.replace(":", "h")}–${prop.fin.replace(":", "h")}`;
        }

        function escapeHtml_(t) {
            return String(t == null ? "" : t)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // Les options d'un même sondage partagent le même identifiant "sondage".
        function pollGroup_(prop) {
            return prop.sondage ? propositionsData.filter(p => p.sondage === prop.sondage) : [prop];
        }

        function ouiCount_(prop) {
            return PEOPLE.filter(p => (prop[p.key] || "").trim() === "Oui").length;
        }

        // Une personne a répondu quand toutes les options du groupe (1 seule hors sondage) sont remplies.
        function personAnsweredAll_(group, person) {
            return group.every(g => (g[person.key] || "").trim() !== "");
        }

        // Statut : 'proposed' | 'confirmed' | 'lost' | 'tie' | 'nobody'.
        // - Sans sondage : confirmé quand les 4 ont répondu ET au moins 2 disent "Oui".
        // - Avec sondage : chacune ne choisit qu'UNE option ; quand les 4 ont voté,
        //   l'option qui a strictement le plus de "Oui" (au moins 2) est confirmée,
        //   les autres sont "non retenues" ; à égalité, rien n'est confirmé.
        function computePropStatus(prop) {
            const group = pollGroup_(prop);
            if (!PEOPLE.every(p => personAnsweredAll_(group, p))) return "proposed";
            if (!prop.sondage) return ouiCount_(prop) >= 2 ? "confirmed" : "proposed";
            const max = Math.max(...group.map(ouiCount_));
            if (max < 2) return "nobody";
            const winners = group.filter(g => ouiCount_(g) === max);
            if (winners.length > 1) return winners.includes(prop) ? "tie" : "lost";
            return winners[0] === prop ? "confirmed" : "lost";
        }

        // ⭐ La plus populaire : strictement plus de "Oui" que les autres (même sondage, ou même jour hors sondage).
        function isLeader_(prop) {
            const set = prop.sondage
                ? pollGroup_(prop)
                : propositionsData.filter(p => !p.sondage && p.date === prop.date);
            if (set.length < 2) return false;
            const mine = ouiCount_(prop);
            return mine > 0 && set.every(p => p === prop || ouiCount_(p) < mine);
        }

        // Liste du champ "Sondage" de la pop-up : aucun / nouveau / sondages à venir existants.
        function buildPollOptions_() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const groups = {};
            propositionsData.forEach(p => {
                const d = parseDate(p.date);
                if (p.sondage && d && d >= today) (groups[p.sondage] = groups[p.sondage] || []).push(p);
            });
            let html = `<option value="">Aucun — événement indépendant</option>`
                + `<option value="new">➕ Nouveau sondage (plusieurs options au choix)</option>`;
            Object.keys(groups).forEach(id => {
                const motifs = groups[id].map(p => p.motif).join(" / ");
                html += `<option value="${escapeHtml_(id)}">Ajouter à : ${escapeHtml_(motifs)}</option>`;
            });
            return html;
        }

        async function addProposition(iso, debut, fin, motif, sondage = "") {
            const prop = { id: "tmp-" + Date.now(), date: iso, debut, fin, motif, anais: "", anneSophie: "", celine: "", sonia: "", sondage };
            propositionsData.push(prop);
            renderApp();

            try {
                const url = `${APPS_SCRIPT_URL}?action=addProposition`
                    + `&date=${encodeURIComponent(iso)}`
                    + `&debut=${encodeURIComponent(debut)}`
                    + `&fin=${encodeURIComponent(fin)}`
                    + `&motif=${encodeURIComponent(motif)}`
                    + `&sondage=${encodeURIComponent(sondage)}`;
                const resp = await fetch(url);
                const result = await resp.json();
                if (!result.success) {
                    propositionsData = propositionsData.filter(p => p !== prop);
                    renderApp();
                    showToast("Erreur : " + (result.error || "inconnue"), "error");
                    return;
                }
                prop.id = result.id;
                storePlanningCache_();
                renderApp();
                showToast("Événement proposé !");
                openNotifyModal(msgProposition_(prop));
            } catch (err) {
                propositionsData = propositionsData.filter(p => p !== prop);
                renderApp();
                showToast("Erreur réseau, réessaie plus tard.", "error");
            }
        }

        async function updateProposition(id, debut, fin, motif) {
            const prop = propositionsData.find(p => p.id === id);
            if (!prop) return;
            if (prop.debut === debut && prop.fin === fin && prop.motif === motif) {
                showToast("Rien n'a changé.", "warn");
                return;
            }
            const avant = { debut: prop.debut, fin: prop.fin, motif: prop.motif };
            const reponsesAvant = PEOPLE.map(p => prop[p.key]);
            const motifChange = motif !== prop.motif;

            prop.debut = debut;
            prop.fin = fin;
            prop.motif = motif;
            // Motif modifié : on repart de zéro sur les réponses. Seule l'heure : on les garde.
            if (motifChange) PEOPLE.forEach(p => { prop[p.key] = ""; });
            renderApp();

            try {
                const url = `${APPS_SCRIPT_URL}?action=updateProposition`
                    + `&id=${encodeURIComponent(id)}`
                    + `&debut=${encodeURIComponent(debut)}`
                    + `&fin=${encodeURIComponent(fin)}`
                    + `&motif=${encodeURIComponent(motif)}`;
                const resp = await fetch(url);
                const result = await resp.json();
                if (!result.success) throw new Error(result.error || "inconnue");
                storePlanningCache_();
                showToast(motifChange ? "Événement modifié, les réponses sont remises à zéro." : "Événement modifié !");
                openNotifyModal(msgModification_(prop, avant.motif, motifChange));
            } catch (err) {
                prop.debut = avant.debut;
                prop.fin = avant.fin;
                prop.motif = avant.motif;
                PEOPLE.forEach((p, i) => { prop[p.key] = reponsesAvant[i]; });
                renderApp();
                showToast("La modification n'a pas pu être enregistrée.", "error");
            }
        }

        async function cancelProposition(id) {
            const prop = propositionsData.find(p => p.id === id);
            if (!prop) return;
            if (id.startsWith("tmp-")) {
                showToast("Un instant, l'événement est en cours d'enregistrement…", "warn");
                return;
            }
            propositionsData = propositionsData.filter(p => p !== prop);
            renderApp();

            try {
                const resp = await fetch(`${APPS_SCRIPT_URL}?action=deleteProposition&id=${encodeURIComponent(id)}`);
                const result = await resp.json();
                if (!result.success) {
                    propositionsData.push(prop);
                    renderApp();
                    showToast("Erreur : " + (result.error || "inconnue"), "error");
                } else {
                    storePlanningCache_();
                    openNotifyModal(msgAnnulation_(prop));
                }
            } catch (err) {
                propositionsData.push(prop);
                renderApp();
                showToast("Erreur réseau, l'annulation n'a pas pu être enregistrée.", "error");
            }
        }

        const SESSION_KEY = "qgd_session_user_v1";

        function login(user) {
            currentUser = user;
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("app-screen").style.display = "block";

            try {
                localStorage.setItem(SESSION_KEY, user);
            } catch (e) {
                // Stockage indisponible : la session ne persistera juste pas au rechargement.
            }

            // Remplit le menu latéral avec le nom + l'avatar de la personne connectée
            const person = PEOPLE.find(p => p.display === user);
            document.getElementById("menu-user-name").textContent = `Connectée : ${user}`;
            document.getElementById("menu-avatar-icon").innerHTML = avatarSvgInner(person);

            // Lien WhatsApp : on l'affiche seulement s'il est configuré
            const waLink = document.getElementById("menu-whatsapp-link");
            if (WHATSAPP_URL) {
                waLink.href = WHATSAPP_URL;
                waLink.style.display = "flex";
            } else {
                waLink.style.display = "none";
            }

            currentTab = "accueil";
            document.getElementById("bottom-nav").style.display = "flex";
            switchTab("accueil");
            loadPlanning();
        }

        function logout() {
            currentUser = "";
            closeMenu();
            try {
                localStorage.removeItem(SESSION_KEY);
            } catch (e) {
                // Pas grave.
            }
            document.getElementById("bottom-nav").style.display = "none";
            document.getElementById("app-screen").style.display = "none";
            document.getElementById("login-screen").style.display = "block";
        }

        function toggleMenu() {
            const overlay = document.getElementById("menu-overlay");
            const drawer = document.getElementById("menu-drawer");
            const btn = document.getElementById("menu-toggle-btn");
            const opening = !drawer.classList.contains("open");
            overlay.classList.toggle("open");
            drawer.classList.toggle("open");
            btn.setAttribute("aria-expanded", opening ? "true" : "false");
            btn.setAttribute("aria-label", opening ? "Fermer le menu" : "Ouvrir le menu");

                let cached = null;
                try {

                    if (raw) cached = JSON.parse(raw);

                    cached = null;

                if (cached && cached.rows && cached.rows.length > 0) {
                    planningData = cached.rows;

        function renderFunStats() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);

            let reunionsCount = 0;
            planningData.forEach(item => {
                const d = parseDate(item.date);
                if (!d || d < monthStart || d > today) return;
                const status = computeGlobalStatus(item);
                if (status.cls === "status-free" || status.cls === "status-free-kids") reunionsCount++;
            });

            const stats = [];
            const MS_JOUR = 86400000;

            // ⏳ Prochain événement confirmé
            const prochain = propositionsData
                .filter(p => {
                    const d = parseDate(p.date);
                    return d && d >= today && computePropStatus(p) === "confirmed";
                })
                .sort((a, b) => (a.date + a.debut).localeCompare(b.date + b.debut))[0];
            if (prochain) {
                const jours = Math.round((parseDate(prochain.date) - today) / MS_JOUR);
                const quand = jours === 0 ? "aujourd'hui" : jours === 1 ? "demain" : `dans ${jours} jours`;
                stats.push(`⏳ Prochain événement confirmé ${quand} : <strong>${escapeHtml_(prochain.motif)}</strong>`);
            }

            // 🙋 La plus partante (nombre de « Oui » aux événements proposés)
            const oui = PEOPLE.map(p => ({
                person: p,
                n: propositionsData.filter(x => (x[p.key] || "").trim() === "Oui").length
            })).sort((a, b) => b.n - a.n);
            if (oui[0] && oui[0].n > 0) {
                const top = oui[0].n;
                const noms = joinNames_(oui.filter(o => o.n === top).map(o => o.person.display));
                const plusieurs = oui.filter(o => o.n === top).length > 1;
                stats.push(`🙋 ${noms} ${plusieurs ? "sont les plus partantes" : "est la plus partante"} : ${top} « Oui » aux événements proposés`);
            }

            // 🌙 Soirées à venir avec au moins 3 dispos (30 prochains jours)
            const dans30 = new Date(today.getTime() + 30 * MS_JOUR);
            const soireesCommunes = planningData.filter(item => {
                const d = parseDate(item.date);
                if (!d || d < today || d >= dans30) return false;
                return PEOPLE.filter(p => (item[p.key] || "").includes("Dispo")).length >= 3;
            }).length;
            stats.push(soireesCommunes === 0
                ? `🌙 Aucune soirée à venir (30 jours) avec 3 dispos ou plus… à vous de remplir !`
                : `🌙 <strong>${soireesCommunes}</strong> soirée${soireesCommunes > 1 ? "s" : ""} à venir (30 jours) où au moins 3 d'entre vous sont dispo`);

            // 📊 Taux de remplissage des dispos (14 prochains jours)
            const dans14 = new Date(today.getTime() + 14 * MS_JOUR);
            let total = 0, remplies = 0;
            planningData.forEach(item => {
                const d = parseDate(item.date);
                if (!d || d < today || d >= dans14) return;
                PEOPLE.forEach(p => {
                    total++;
                    if ((item[p.key] || "").trim() !== "") remplies++;
                    if (hasJourneeSlot(item)) {
                        total++;
                        if ((item[p.key + "Journee"] || "").trim() !== "") remplies++;
                    }
                });
            });
            if (total > 0) {
                stats.push(`📊 Dispos remplies pour les 14 prochains jours : <strong>${Math.round(remplies / total * 100)} %</strong>`);
            }

            return `
                <div class="overview-label">PETITES STATS</div>
                <p style="margin:10px 0 6px;">🎉 Vous vous êtes toutes retrouvées <strong>${reunionsCount}</strong> fois ce mois-ci</p>
                ${stats.map(t => `<p style="margin:6px 0 0;">${t}</p>`).join("")}
            `;
        }

        function getUpcomingWeekend() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const day = today.getDay(); // 0=Dim ... 6=Sam
            let fridayOffset;
            if (day === 5) fridayOffset = 0;
            else if (day === 6) fridayOffset = -1;
            else if (day === 0) fridayOffset = -2;
            else fridayOffset = 5 - day;

            const friday = new Date(today);
            friday.setDate(today.getDate() + fridayOffset);
            const saturday = new Date(friday); saturday.setDate(friday.getDate() + 1);
            const sunday = new Date(friday); sunday.setDate(friday.getDate() + 2);

            return [
                { label: "Vendredi", date: friday },
                { label: "Samedi", date: saturday },
                { label: "Dimanche", date: sunday }
            ];
        }

                        <div class="day-people">☀️ Journée : ${journeeNames.length ? journeeNames.join(", ") : "Personne de dispo"}</div>
                        <div class="day-people">🌙 Soirée : ${soireeNames.length ? soireeNames.join(", ") : "Personne de dispo"}</div>
                    `;
                } else {
                    const dispoNames = PEOPLE.filter(p => (match[p.key] || "").includes("Dispo")).map(p => p.display);
                    bodyHtml = `<div class="day-people">Dispo : ${dispoNames.length ? dispoNames.join(", ") : "Personne de dispo"}</div>`;
                }

                const row = document.createElement("div");
                row.className = "overview-row";
                row.setAttribute("role", "button");
                row.setAttribute("tabindex", "0");
                row.innerHTML = `
                    <div>
                        <div class="day-name">${label}</div>
                        ${bodyHtml}
                    </div>
                    <span class="chevron" aria-hidden="true">›</span>
                `;
                row.setAttribute("aria-label", `${label} : ${row.textContent.trim()}`);
                row.onclick = () => goToDate(match, label);
                row.onkeydown = (e) => {
                    if (e.key === "Enter" || e.key === " ") {
                        e.preventDefault();
                        goToDate(match, label);
                    }
                };
                target.appendChild(row);
            });
        }

        function goToDate(match, label) {
            if (!match) {
                showToast(`Le ${label} n'est pas encore renseigné dans le planning.`, "warn");
                return;
            }
            currentView = "list";
            switchTab("liste");
            requestAnimationFrame(() => {
                const card = document.querySelector(`[data-row="${match.sheetRow}"]`);
                if (card) {
                    card.scrollIntoView({ behavior: "smooth", block: "center" });
                    card.classList.add("highlight-flash");
                    setTimeout(() => card.classList.remove("highlight-flash"), 1500);
                }
            });
        }

        // ----- Prévenir le groupe sur WhatsApp -----
        // WhatsApp n'autorise pas l'envoi automatique depuis une appli : on prépare
        // le message, la personne qui agit choisit le groupe et appuie sur envoyer.
        function propWhen_(prop) {
            const d = parseDate(prop.date);
            const jours = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
            const quand = d ? `${jours[d.getDay()]} ${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}` : prop.date;
            return `${quand} de ${prop.debut.replace(":", "h")} à ${prop.fin.replace(":", "h")}`;
        }

        function msgProposition_(prop) {
            if (prop.sondage) {
                return `🗳️ Sondage : « ${prop.motif} » le ${propWhen_(prop)} (une seule option à choisir). Vote sur Le QG des Daronnes : ${APP_URL}`;
            }
            return `🍷 Nouvelle proposition : « ${prop.motif} » le ${propWhen_(prop)}. Dis si tu viens sur Le QG des Daronnes : ${APP_URL}`;
        }

        function msgModification_(prop, ancienMotif, motifChange) {
            const suite = motifChange
                ? `(avant : « ${ancienMotif} »). Les réponses sont à refaire : ${APP_URL}`
                : `Tes réponses restent valables.`;
            return `✏️ Changement : « ${prop.motif} » c'est maintenant le ${propWhen_(prop)}. ${suite}`;
        }

        function msgAnnulation_(prop) {
            return `❌ Annulé : « ${prop.motif} » prévu le ${propWhen_(prop)}.`;
        }

        function msgConfirmation_(prop) {
            const partants = PEOPLE.filter(p => (prop[p.key] || "") === "Oui").map(p => p.display).join(", ");
            return `🎉 C'est confirmé : « ${prop.motif} » le ${propWhen_(prop)} ! Avec : ${partants}. L'invitation arrive dans votre agenda.`;
        }

        let notifyTriggerEl = null;

        function openNotifyModal(text) {
            notifyTriggerEl = document.activeElement;
            document.getElementById("notify-text").value = text;
            document.getElementById("notify-overlay").classList.add("open");
            document.getElementById("notify-modal").classList.add("open");
        }

        function closeNotifyModal() {
            document.getElementById("notify-overlay").classList.remove("open");
            document.getElementById("notify-modal").classList.remove("open");
            const elToFocus = notifyTriggerEl;
            notifyTriggerEl = null;
            if (elToFocus) setTimeout(() => elToFocus.focus(), 0);
        }

        function submitNotify() {
            const text = document.getElementById("notify-text").value.trim();
            if (!text) return;
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, "_blank", "noopener");
            closeNotifyModal();
        }

        function notifyProposal(id) {
            const prop = propositionsData.find(p => p.id === id);
            if (prop) openNotifyModal(msgProposition_(prop));
        }

        // ----- Relances : prévenir celles qui n'ont pas répondu -----
        function joinNames_(names) {
            if (names.length <= 1) return names.join("");
            return names.slice(0, -1).join(", ") + " et " + names[names.length - 1];
        }

        // Personnes (hors moi) qui n'ont pas encore répondu à une proposition.
        function pendingForProp_(prop) {
            const group = pollGroup_(prop);
            return PEOPLE.filter(p => p.display !== currentUser && !personAnsweredAll_(group, p));
        }

        function relanceProposition(id) {
            const prop = propositionsData.find(p => p.id === id);
            if (!prop) return;
            const pending = pendingForProp_(prop);
            if (pending.length === 0) {
                showToast("Plus personne à relancer.", "warn");
                return;
            }
            const plusieurs = pending.length > 1;
            const noms = joinNames_(pending.map(p => p.display));
            openNotifyModal(`🔔 Coucou ${noms}, ${plusieurs ? "vous n'avez" : "tu n'as"} pas encore répondu pour « ${prop.motif} » le ${propWhen_(prop)}. ${plusieurs ? "Vous venez" : "Tu viens"} ? ${APP_URL}`);
        }

        // Jours concernés : "weekend" (week-end à venir) ou un nombre de jours à partir d'aujourd'hui.
        function itemsInScope_(scope) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            if (scope === "weekend") {
                const days = getUpcomingWeekend();
                return planningData.filter(item => {
                    const d = parseDate(item.date);
                    return d && d >= today && days.some(w => isoDateStr_(w.date) === isoDateStr_(d));
                });
            }
            const limit = new Date(today);
            limit.setDate(limit.getDate() + Number(scope));
            return planningData.filter(item => {
                const d = parseDate(item.date);
                return d && d >= today && d < limit;
            });
        }

        // Personnes (hors moi) qui ont au moins une dispo non renseignée dans la période.
        function missingDispos_(scope) {
            const items = itemsInScope_(scope);
            return PEOPLE.filter(p => p.display !== currentUser && items.some(item => {
                if (!(item[p.key] || "").trim()) return true;
                return hasJourneeSlot(item) && !(item[p.key + "Journee"] || "").trim();
            }));
        }

        function relanceDispos(scope) {
            const missing = missingDispos_(scope);
            if (missing.length === 0) {
                showToast("Tout le monde a répondu 🎉", "warn");
                return;
            }
            const plusieurs = missing.length > 1;
            const noms = joinNames_(missing.map(p => p.display));
            const quand = scope === "weekend" ? "ce week-end" : "les prochaines semaines";
            openNotifyModal(`🔔 Coucou ${noms}, ${plusieurs ? "pensez" : "pense"} à renseigner ${plusieurs ? "vos" : "tes"} dispos pour ${quand} sur Le QG des Daronnes : ${APP_URL}`);
        }

        // Une carte pour CHAQUE événement proposé à venir (plusieurs possibles le
        // même jour) — seules les dates déjà passées sont exclues.
        function renderPropositionCards() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const jours = ["Dimanche", "Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi"];
            const upcoming = propositionsData
                .map(prop => ({ prop, d: parseDate(prop.date) }))
                .filter(x => x.d && x.d >= today && computePropStatus(x.prop) !== "lost")
                .sort((a, b) => (a.prop.date + a.prop.debut).localeCompare(b.prop.date + b.prop.debut));

            return upcoming.map(({ prop, d }) => {
                const status = computePropStatus(prop);
                const label = status === "confirmed" ? (prop.sondage ? "Option retenue" : "Événement confirmé")
                    : status === "tie" ? "Sondage : égalité"
                    : status === "nobody" ? "Sondage : pas assez de votes"
                    : prop.sondage ? "🗳️ Sondage — choisis une option"
                    : "Événement proposé";
                const dateTxt = `${jours[d.getDay()]} ${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
                const smsBtn = status !== "confirmed"
                    ? `<button class="sms-link-btn" onclick="notifyProposal('${prop.id}')" style="margin-top:8px; display:inline-flex;">💬 Prévenir sur WhatsApp</button>`
                    : "";
                return `
                    <div class="label">${icon("wine")} ${label}</div>
                    <div class="value">${dateTxt}</div>
                    <div style="margin-top:2px; opacity:0.8;">${formatPropTime_(prop)} · ${escapeHtml_(prop.motif)}${isLeader_(prop) ? " ⭐" : ""} <span class="vote-count">✓ ${ouiCount_(prop)}</span></div>
                    <div class="slot-label" style="margin-top:8px; justify-content:center; color:var(--text); opacity:0.65; text-transform:none; letter-spacing:0;">${icon("wine", 14)} ${prop.sondage ? "Je choisis cette option ?" : "Qui vient ?"}</div>
                    ${buildParticipationRow(prop)}
                    <button onclick="openIcsModalForProp('${prop.id}')" style="margin-top:12px;">${icon("calendar", 16)} Ajouter à mon agenda perso</button>
                    <div>${smsBtn}</div>
                    <div><button class="btn-subtle" onclick="openEditModal('${prop.id}')" style="margin-top:8px;">Modifier l'événement</button></div>
                `;
            });
        }

        function renderNextAvailable() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const upcoming = planningData
                .map(item => ({ item, d: parseDate(item.date) }))
                .filter(x => x.d && x.d >= today)
                .sort((a, b) => a.d - b.d);

            const found = upcoming.find(x => PEOPLE.every(p => (x.item[p.key] || "").includes("Dispo")));

            if (found) {
                const isoDate = `${found.d.getFullYear()}-${String(found.d.getMonth() + 1).padStart(2, "0")}-${String(found.d.getDate()).padStart(2, "0")}`;
                return `
                    <div class="label">${icon("moon")} Prochaine soirée où tout le monde est dispo</div>
                    <div class="value">${found.item.jour} ${found.item.date}</div>
                    <button onclick="openIcsModal('${isoDate}')" style="margin-top:12px;">${icon("calendar", 16)} Ajouter à mon agenda perso</button>
                `;
            }
            return `
                <div class="label">${icon("clock")} Pas encore de date en commun</div>
                <div class="value">Continuez à mettre vos dispos à jour !</div>
            `;
        }

        // Échappe les caractères spéciaux pour un champ de fichier .ics
        function icsEscape_(text) {
            return String(text || "")
                .replace(/\\/g, "\\\\")
                .replace(/;/g, "\\;")
                .replace(/,/g, "\\,")
                .replace(/\n/g, "\\n");
        }

        // Génère et télécharge un fichier .ics pour ajouter un événement à un agenda perso.
        // debut/fin au format "HH:MM" ; titre/notes personnalisables (pop-up openIcsModal*).
        function downloadEventICS(isoDateStr, debut, fin, titre, notes) {
            const [y, m, d] = isoDateStr.split("-").map(Number);
            const pad = (n) => String(n).padStart(2, "0");
            const [h1, mi1] = debut.split(":").map(Number);
            const [h2, mi2] = fin.split(":").map(Number);
            const dtStart = `${y}${pad(m)}${pad(d)}T${pad(h1)}${pad(mi1)}00`;
            // Fin après minuit (ex. 23h -> 1h) : on passe au jour suivant.
            const endDay = (h2 * 60 + mi2 <= h1 * 60 + mi1) ? new Date(y, m - 1, d + 1) : new Date(y, m - 1, d);
            const dtEnd = `${endDay.getFullYear()}${pad(endDay.getMonth() + 1)}${pad(endDay.getDate())}T${pad(h2)}${pad(mi2)}00`;
            const dtStamp = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";

            const ics = [
                "BEGIN:VCALENDAR",
                "VERSION:2.0",
                "PRODID:-//QG des Daronnes//FR",
                "BEGIN:VEVENT",
                `UID:qgd-${isoDateStr}-${Date.now()}@qgdaronnes`,
                `DTSTAMP:${dtStamp}`,
                `DTSTART:${dtStart}`,
                `DTEND:${dtEnd}`,
                `SUMMARY:${icsEscape_(titre || "🍷 QG des Daronnes")}`,
                `DESCRIPTION:${icsEscape_(notes || "")}`,
                "END:VEVENT",
                "END:VCALENDAR"
            ].join("\r\n");

            const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `soiree-qgd-${isoDateStr}.ics`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("Événement téléchargé, ouvre-le pour l'ajouter à ton agenda.");
        }

        // ==========================================================
        // POP-UP "AJOUTER A MON AGENDA" (personnalisation titre/notes)
        // ==========================================================
        let pendingIcs = null;
        let icsTriggerEl = null;

        function openIcsModal_(isoDateStr, debut, fin, titre, notes) {
            pendingIcs = { isoDateStr, debut, fin };
            icsTriggerEl = document.activeElement;
            document.getElementById("ics-title-input").value = titre;
            document.getElementById("ics-notes-input").value = notes;
            document.getElementById("ics-overlay").classList.add("open");
            document.getElementById("ics-modal").classList.add("open");
            setTimeout(() => document.getElementById("ics-title-input").focus(), 50);
        }

        // Événement proposé : horaires et motif repris de la proposition.
        function openIcsModalForProp(propId) {
            const prop = propositionsData.find(p => p.id === propId);
            if (!prop) return;
            openIcsModal_(prop.date, prop.debut, prop.fin, `🍷 QG des Daronnes — ${prop.motif}`, "Moment entre daronnes");
        }

        // Prochaine date où tout le monde est dispo (pas de proposition associée).
        function openIcsModal(isoDateStr, slot = "evening") {
            const debut = slot === "day" ? "10:00" : "20:00";
            const fin = slot === "day" ? "18:00" : "23:00";
            const titre = slot === "day" ? "☀️ Journée QG des Daronnes" : "🍷 Soirée QG des Daronnes";
            openIcsModal_(isoDateStr, debut, fin, titre, "Moment entre daronnes");

            document.getElementById("ics-overlay").classList.remove("open");
            document.getElementById("ics-modal").classList.remove("open");

        function submitIcsDownload() {
            if (!pendingIcs) return;
            const titre = document.getElementById("ics-title-input").value;
            const notes = document.getElementById("ics-notes-input").value;
            const { isoDateStr, debut, fin } = pendingIcs;
            closeIcsModal();
            downloadEventICS(isoDateStr, debut, fin, titre, notes);
