        // ----- Onglet Idée -----
        const IDEAS = [
            "Soirée jeux de société 🎲",
            "Resto entre daronnes 🍕",
            "Apéro chez l'une de vous 🍷",
            "Ciné + pyjama party 🍿",
            "Karaoké improvisé 🎤",
            "Cours de cuisine maison 👩‍🍳",
            "Balade + café 🚶‍♀️☕",
            "Soirée déguisée 🎭",
            "Pique-nique au parc 🧺"
        ];
        const CUSTOM_IDEAS_KEY = "qgd_custom_ideas_v1";
        let lastIdeaDrawn = null;

        function getCustomIdeas() {
            try {
                const raw = localStorage.getItem(CUSTOM_IDEAS_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        }

        function saveCustomIdeas(list) {
            try {
                localStorage.setItem(CUSTOM_IDEAS_KEY, JSON.stringify(list));
            } catch (e) {
                // Stockage indisponible : tant pis, la liste ne persistera pas.
            }
        }

        function getAllIdeas() {
            return IDEAS.concat(getCustomIdeas());
        }

        function renderIdee(container) {
            const card = document.createElement("div");
            card.className = "card";
            card.style.textAlign = "center";
            card.innerHTML = `
                <div class="overview-title">${icon("dice")} Besoin d'inspiration ?</div>
                <p style="opacity:0.75;">Laisse le hasard choisir votre prochaine soirée !</p>
                <div id="idee-result" style="font-size:1.3rem; font-weight:bold; margin:20px 0; min-height:1.6em;">?</div>
                <button onclick="tirerIdee()">${icon("dice", 16)} Tirer une idée</button>
            `;

            const addCard = document.createElement("div");
            addCard.className = "card";
            addCard.innerHTML = `
                <div class="overview-label" style="text-align:center;">VOS IDÉES</div>

        function renderCustomIdeasList() {
            const listEl = document.getElementById("custom-ideas-list");
            if (!listEl) return;
            const customIdeas = getCustomIdeas();
            if (customIdeas.length === 0) {
                listEl.innerHTML = `<p style="font-size:0.8rem; opacity:0.6; margin:0;">Aucune idée ajoutée pour l'instant.</p>`;

        function addCustomIdea() {
            const input = document.getElementById("new-idea-input");
            const value = input.value.trim();
            if (!value) return;
            const customIdeas = getCustomIdeas();
            customIdeas.push(value);
            saveCustomIdeas(customIdeas);
            input.value = "";
            renderCustomIdeasList();
            showToast("Idée ajoutée !");

            const customIdeas = getCustomIdeas();
            customIdeas.splice(index, 1);

            renderCustomIdeasList();

        function tirerIdee() {
            const resultEl = document.getElementById("idee-result");
            const pool = getAllIdeas();
            let count = 0;
            const spin = setInterval(() => {
                resultEl.textContent = pool[Math.floor(Math.random() * pool.length)];
                count++;
                if (count > 10) {
                    clearInterval(spin);
                    // Évite de retomber deux fois de suite sur la même idée (si le pool le permet)
                    let finalPick = pool[Math.floor(Math.random() * pool.length)];
                    let attempts = 0;
                    while (finalPick === lastIdeaDrawn && pool.length > 1 && attempts < 10) {
                        finalPick = pool[Math.floor(Math.random() * pool.length)];
                        attempts++;
                    }
                    lastIdeaDrawn = finalPick;
                    resultEl.textContent = finalPick;
                }
            }, 80);
        }

                    });
                };
            }

            const inner = document.createElement("div");
            inner.id = "planning-inner";
            container.appendChild(inner);

            if (currentView === "list") {
                renderListResults();
            } else {
                renderCalendarView(inner);
            }
        }

        function renderListResults() {
            const container = document.getElementById("planning-inner");
            if (!container) return;
            container.innerHTML = "";

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            let filtered = planningData.filter(item => {
                const d = parseDate(item.date);
                return d && d >= today;
            });

            if (listSearchQuery.trim() !== "") {
                const q = listSearchQuery.trim().toLowerCase();
                filtered = filtered.filter(item =>
                    item.jour.toLowerCase().includes(q) || item.date.toLowerCase().includes(q)
                );
            }

            if (filtered.length === 0) {
                container.innerHTML = "<p style='text-align:center; opacity:0.6;'>Aucune date à venir ne correspond.</p>";
                return;
            }

            const toShow = filtered.slice(0, listVisibleCount);
            toShow.forEach(item => {
                const realIndex = planningData.indexOf(item);
                container.appendChild(buildCard(item, realIndex));
            });

            if (filtered.length > listVisibleCount) {
                const moreWrap = document.createElement("div");
                moreWrap.style.textAlign = "center";
                moreWrap.style.marginTop = "8px";
                const moreBtn = document.createElement("button");
                moreBtn.textContent = "Voir plus de dates";
                moreBtn.onclick = () => {
                    listVisibleCount += 20;
                    renderListResults();
                };
                moreWrap.appendChild(moreBtn);
                container.appendChild(moreWrap);
            }
        }

        async function manualRefresh() {
            const btn = document.getElementById("menu-refresh-btn");
            const label = btn.querySelector("span");
            const original = label.textContent;
            btn.disabled = true;
            label.textContent = "Actualisation...";
            await loadPlanning();
            label.textContent = "Actualisé ✓";
            setTimeout(() => {
                label.textContent = original;
                btn.disabled = false;
                closeMenu();
            }, 1000);
        }

        // Icônes SVG en contour réutilisables (même style que les avatars/nav)
        function icon(name, size = 18) {
            const paths = {
                moon: `<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/>`,
                calendar: `<rect x="4" y="5" width="16" height="15" rx="2"/><line x1="4" y1="10" x2="20" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/>`,
                list: `<circle cx="5" cy="6" r="1.2" fill="currentColor" stroke="none"/><line x1="9" y1="6" x2="20" y2="6"/><circle cx="5" cy="12" r="1.2" fill="currentColor" stroke="none"/><line x1="9" y1="12" x2="20" y2="12"/><circle cx="5" cy="18" r="1.2" fill="currentColor" stroke="none"/><line x1="9" y1="18" x2="20" y2="18"/>`,
                dice: `<rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="8.5" cy="8.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.1" fill="currentColor" stroke="none"/>`,
                clock: `<circle cx="12" cy="12" r="8"/><polyline points="12 8 12 12 15 14"/>`,
                sun: `<circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/>`,
                wine: `<path d="M6 3h12c-0.5 5-2.5 9-6 9s-5.5-4-6-9Z"/><line x1="12" y1="12" x2="12" y2="19"/><line x1="8" y1="21" x2="16" y2="21"/>`
            };
            return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" width="${size}" height="${size}" style="vertical-align:-4px; margin-right:4px;" aria-hidden="true">${paths[name] || ""}</svg>`;
        }

        function getCurrentPersonKey() {
            const person = PEOPLE.find(p => p.display === currentUser);
            return person ? person.key : null;
        }

        // Un jour est "week-end" si c'est un Samedi ou un Dimanche
        function isWeekendDay(item) {
            const d = parseDate(item.date);
            if (!d) return false;
            const day = d.getDay();
            return day === 0 || day === 6;
        }

        // Un jour a une case "Journée" (en plus de la "Soirée") si c'est un
        // week-end, un jour férié, ou un jour de vacances scolaires zone A —
        // même si ce jour férié/vacances tombe un jour de semaine.
        function hasJourneeSlot(item) {
            if (isWeekendDay(item)) return true;
            const d = parseDate(item.date);
            if (!d) return false;
            return isJourFerie(d) || isVacancesZoneA(d);
        }

        // Calcule le statut global à partir des statuts (indépendant de la
        // colonne "Analyse" du Sheet, pour garder la main sur le texte affiché).
        // Les jours avec une case "Journée" (week-end, férié, vacances) comptent
        // la Journée ET la Soirée.
        function computeGlobalStatus(item) {
            const journeeSlot = hasJourneeSlot(item);
            const statuses = [];
            PEOPLE.forEach(p => {
                statuses.push((item[p.key] || "").trim());
                if (journeeSlot) statuses.push((item[p.key + "Journee"] || "").trim());
            });
            const hasIndispo = statuses.some(s => s !== "" && !s.includes("Dispo"));
            if (hasIndispo) {
                return { text: "Pas toutes dispo", cls: "status-blocked" };
            }
            const hasPending = statuses.some(s => s === "");
            if (hasPending) {
                return { text: "En attente de réponses", cls: "status-pending" };
            }
            const hasEnfants = statuses.some(s => s.includes("enfants") || s.includes("👶"));
            if (hasEnfants) {
                return { text: "Libre avec enfants", cls: "status-free-kids" };
            }
            return { text: "Tout le monde est libre !", cls: "status-free" };
        }

        // Détermine l'état "pastille" d'une personne pour un créneau : la
        // COULEUR reste toujours celle de la personne, seule la forme change.
        // 'inconnu' = rond gris | 'dispo' = rond coloré | 'enfants' = triangle coloré | 'indispo' = croix colorée
        function pastilleState(rawState) {
            rawState = rawState || "";
            if (rawState.trim() === "") return "inconnu";
            if (rawState.includes("enfants") || rawState.includes("👶")) return "enfants";
            if (rawState.includes("Dispo")) return "dispo";
            return "indispo";
        }

        function pastilleCrossSVG(color, size = 16) {
            return `<svg class="pastille-cross" viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true">
                <line x1="6" y1="6" x2="18" y2="18" stroke="${color}" stroke-width="3" stroke-linecap="round"/>
                <line x1="18" y1="6" x2="6" y2="18" stroke="${color}" stroke-width="3" stroke-linecap="round"/>
            </svg>`;
        }

        // Triangle plein aux coins légèrement arrondis (utilisé pour "dispo avec
        // enfants" à la place du carré, partout où une pastille est affichée).
        function pastilleTriangleSVG(color, size = 16) {
            return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true">
                <path d="M12.7,4.4 L19.8,18.1 Q20.5,19.5 18.9,19.5 L5.1,19.5 Q3.5,19.5 4.2,18.1 L11.3,4.4 Q12,3 12.7,4.4 Z" fill="${color}"/>
            </svg>`;
        }

        // Réponse "je viens / je viens pas" à un événement PROPOSÉ — totalement
        // indépendante des dispos générales (quelqu'un peut être dispo mais ne pas
        // vouloir faire l'activité proposée, ou inversement se libérer pour l'occasion).
        function participationState(rawState) {
            rawState = (rawState || "").trim();
            if (rawState === "Oui") return "oui";
            if (rawState === "Non") return "non";
            return "inconnu";
        }

        function nextParticipation(current) {
            current = (current || "").trim();
            if (current === "") return "Oui";
            if (current === "Oui") return "Non";
            return "Oui";
        }

        // Construit la rangée "Qui vient ?" d'une proposition.
        // Ne modifie jamais les colonnes de dispo générale.
        function buildParticipationRow(prop) {
            const myKey = getCurrentPersonKey();
            return `
                <div class="participants-row participation-row">
                    ${PEOPLE.map(p => {
                        const isMine = p.key === myKey;
                        const state = participationState(prop[p.key]);
                        const stateLabel = state === "inconnu" ? "n'a pas encore répondu à la proposition"
                            : state === "oui" ? "vient"
                            : "ne vient pas";
                        const content = state === "non" ? pastilleCrossSVG(p.color, 34) : "";
                        return `
                        <div class="participant-badge">
                            <span>${p.short}</span>
                            <button class="round-btn part-${state}"
                                    style="--pastille-color:${p.color}"
                                    aria-label="${p.display} : ${stateLabel}${isMine ? ', appuyer pour changer' : ''}"
                                    ${isMine
                                        ? `onclick="changeParticipation('${prop.id}', '${p.key}')"`
                                        : `disabled title="Seule ${p.display} peut répondre pour elle-même"`}>
                                <span aria-hidden="true">${content}</span>
                            </button>
                        </div>
                    `;
                    }).join("")}
                </div>
            `;
        }

        async function changeParticipation(propId, personKey) {
            const prop = propositionsData.find(p => p.id === propId);
            if (!prop) return;
            const group = pollGroup_(prop);
            if (group.some(g => g.id.startsWith("tmp-"))) {
                showToast("Un instant, l'événement est en cours d'enregistrement…", "warn");
                return;
            }
            const person = PEOPLE.find(p => p.key === personKey);
            const oldVal = prop[personKey];
            const newVal = nextParticipation(oldVal);
            const statutsAvant = new Map(group.map(g => [g, computePropStatus(g)]));
            const autresAvant = group.filter(g => g !== prop).map(g => [g, g[personKey]]);

            prop[personKey] = newVal;
            // Sondage : "Oui" à une option = "Non" aux autres (un seul choix possible).
            if (prop.sondage && newVal === "Oui") {
                group.forEach(g => { if (g !== prop) g[personKey] = "Non"; });
            }
            renderApp();

            const annuler = () => {
                prop[personKey] = oldVal;
                autresAvant.forEach(([g, v]) => { g[personKey] = v; });
                renderApp();
            };

            try {
                const url = `${APPS_SCRIPT_URL}?action=updatePropParticipation`
                    + `&id=${encodeURIComponent(propId)}`
                    + `&personne=${encodeURIComponent(person.column)}`
                    + `&statut=${encodeURIComponent(newVal)}`;
                const resp = await fetch(url);
                const result = await resp.json();
                if (!result.success) {
                    showToast("Erreur d'enregistrement : " + (result.error || "inconnue"), "error");
                    annuler();
                } else {
                    storePlanningCache_();
                    const nouveau = group.find(g => statutsAvant.get(g) !== "confirmed" && computePropStatus(g) === "confirmed");
                    if (nouveau) {
                        showToast("C'est confirmé !");
                        openNotifyModal(msgConfirmation_(nouveau));
                    }
                }
            } catch (err) {
                showToast("Erreur réseau : la réponse n'a pas pu être sauvegardée.", "error");
                annuler();
            }
        }

        // Construit la rangée de pastilles pour un créneau donné ('evening' = soirée, 'day' = journée)
        // Les dispos restent toujours visibles et modifiables, qu'une soirée soit proposée ou non.
        function buildParticipantsRow(item, index, slot) {
            const myKey = getCurrentPersonKey();
            return `
                <div class="participants-row">
                    ${PEOPLE.map(p => {
                        const isMine = p.key === myKey;
                        const dataKey = slot === "day" ? (p.key + "Journee") : p.key;
                        const rawState = item[dataKey] || "";
                        const state = pastilleState(rawState);

                        const stateLabel = state === "inconnu" ? "pas encore répondu"
                            : state === "enfants" ? "disponible avec enfants"
                            : state === "dispo" ? "disponible"
                            : "indisponible";
                        const content = state === "indispo" ? pastilleCrossSVG(p.color, 34)
                            : state === "enfants" ? pastilleTriangleSVG(p.color, 34)
                            : "";
                        return `
                        <div class="participant-badge">
                            <span>${p.short}</span>
                            <button class="round-btn state-${state}"
                                    style="--pastille-color:${p.color}"
                                    aria-label="${p.display} : ${stateLabel}${isMine ? ', appuyer pour changer' : ''}"
                                    ${isMine
                                        ? `onclick="changeStatus(${index}, '${p.key}', '${slot}')"`
                                        : `disabled title="Seule ${p.display} peut modifier son statut"`}>
                                <span aria-hidden="true">${content}</span>
                            </button>
                        </div>
                    `;
                    }).join("")}
                </div>
            `;
        }

        // Barre sous une proposition : grise (en cours / non retenue / égalité) ou à
        // segments colorés (confirmée automatiquement, un segment par personne qui vient).
        function buildProposalBar(prop) {
            const status = computePropStatus(prop);
            const group = pollGroup_(prop);
            const modifier = `<button onclick="openEditModal('${prop.id}')">Modifier</button>`;
            const annuler = (label) => `<button onclick="cancelProposition('${prop.id}')">${label}</button>`;
            const whatsapp = `<button onclick="notifyProposal('${prop.id}')">💬 WhatsApp</button>`;
            const relance = pendingForProp_(prop).length > 0
                ? `<button onclick="relanceProposition('${prop.id}')">🔔 Relancer</button>` : "";
            const barre = (message, boutons) => `
                <div class="proposal-bar-wrap is-grey">
                    <div class="proposal-bar-body">
                        ${message}
                        <span style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">${boutons}</span>
                    </div>
                </div>
            `;

            if (status === "confirmed") {
                const partants = PEOPLE.filter(p => (prop[p.key] || "") === "Oui");
                const segments = partants.map(p => `<span style="flex:1; background:${p.color};"></span>`).join("");
                return `
                    <div class="proposal-bar-wrap is-confirmed">
                        <div class="proposal-bar-segments">${segments}</div>
                        <div class="proposal-bar-body">
                            <span>${icon("wine", 14)} ${prop.sondage ? "Option retenue" : "Événement confirmé"}</span>
                            <span style="display:flex; gap:10px; align-items:center;">${modifier}${annuler("Annuler")}</span>
                        </div>
                    </div>
                `;
            }
            if (status === "lost") {
                return barre(`<span>${icon("wine", 14)} Non retenue — une autre option a gagné</span>`, annuler("Annuler"));
            }
            if (status === "tie") {
                return barre(`<span class="proposal-bar-warning">Égalité entre plusieurs options — à départager (changez un vote ou annulez une option)</span>`,
                    `${whatsapp}${modifier}${annuler("Annuler")}`);
            }
            if (status === "nobody") {
                return barre(`<span class="proposal-bar-warning">Pas assez de votes pour le moment — annuler ?</span>`,
                    `${whatsapp}${modifier}${annuler("Annuler")}`);
            }
            if (prop.sondage) {
                const msg = group.length < 2
                    ? "Sondage : ajoute une autre option pour pouvoir choisir"
                    : "Sondage en cours — une seule option par personne";
                return barre(`<span>${icon("wine", 14)} ${msg}</span>`, `${whatsapp}${relance}${modifier}${annuler("Annuler")}`);
            }
            const allAnswered = PEOPLE.every(p => (prop[p.key] || "").trim() !== "");
            const message = allAnswered
                ? `<span class="proposal-bar-warning">Pas assez de monde partant pour l'instant — annuler la proposition ?</span>`
                : `<span>${icon("wine", 14)} Proposé — en attente de réponses</span>`;
            return barre(message, `${whatsapp}${relance}${modifier}${annuler(allAnswered ? "Annuler la proposition" : "Annuler")}`);
        }

        // Badges à côté de la date (un par événement).
        function proposalBadgesHtml(props) {
            return props.map(prop => {
                const time = prop.debut.replace(":", "h");
                const ic = prop.sondage ? "🗳️" : "🍷";
                const status = computePropStatus(prop);
                if (status === "confirmed") return `<span class="badge-confirmed">${ic} ${time} Confirmé</span>`;
                if (status === "lost") return `<span class="badge-proposed" style="opacity:0.6; text-decoration:line-through;">${ic} ${time} Non retenue</span>`;
                return `<span class="badge-proposed">${ic} ${time} ${prop.sondage ? "Sondage" : "Proposé"}</span>`;
            }).join("");
        }

        function buildCard(item, index) {
            const card = document.createElement("div");
            card.className = "card";
            card.dataset.row = item.sheetRow;
            const globalStatus = computeGlobalStatus(item);
            const journeeSlot = hasJourneeSlot(item);
            const d = parseDate(item.date);
            const props = d ? propsForDate_(isoDateStr_(d)) : [];
            const badges = proposalBadgesHtml(props);

            const dispoHtml = journeeSlot
                ? `
                    <div class="slot-label">${icon("sun", 14)} Journée</div>
                    ${buildParticipantsRow(item, index, "day")}
                    <div class="slot-label" style="margin-top:10px;">${icon("moon", 14)} Soirée</div>
                    ${buildParticipantsRow(item, index, "evening")}
                `
                : buildParticipantsRow(item, index, "evening");

            const propsHtml = props.map(prop => `
                <div class="prop-block">
                    ${prop.sondage ? `<div class="poll-tag">🗳️ Sondage — une seule option possible</div>` : ""}
                    <div class="prop-title">${icon("wine", 14)} ${formatPropTime_(prop)} · ${escapeHtml_(prop.motif)}${isLeader_(prop) ? " ⭐" : ""}<span class="vote-count">✓ ${ouiCount_(prop)}</span></div>
                    <div class="slot-label" style="justify-content:center; color:var(--text); opacity:0.65; text-transform:none; letter-spacing:0;">${prop.sondage ? "Je choisis cette option ?" : "Qui vient ?"}</div>
                    ${buildParticipationRow(prop)}
                    ${buildProposalBar(prop)}
                </div>
            `).join("");

            card.innerHTML = `
                <div class="date-header">
                    <span>${item.jour} ${item.date}</span>
                    <span class="status-global ${globalStatus.cls}">${globalStatus.text}</span>
                    ${badges ? `<div class="extra-badges">${badges}</div>` : ""}
                </div>
                ${dispoHtml}
                ${propsHtml}
                <div class="confirm-btn-wrap">
                    <button class="btn-subtle" onclick="openConfirmModal(${index})">${icon("wine", 16)} Proposer un événement</button>
                </div>
            `;
            return card;
        }

        // ==========================================================
        // CYCLE DE STATUT + ECRITURE REELLE VERS GOOGLE SHEETS
        // Ordre : (pas encore répondu) -> Dispo -> Indispo -> Dispo - enfants -> Dispo
        // ==========================================================
        function nextStatus(current) {
            current = current || "";
            if (current.trim() === "") return "Dispo";
            if (current.includes("enfants")) return "Dispo";
            if (current.includes("Dispo")) return "Indispo";
            return "Dispo - enfants";
        }

        async function changeStatus(index, personKey, slot = "evening") {
            if (APPS_SCRIPT_URL.includes("COLLE_ICI")) {
                showToast("L'URL de l'Apps Script n'a pas encore été configurée dans le code (APPS_SCRIPT_URL).", "error");
                return;
            }

            const item = planningData[index];
            const person = PEOPLE.find(p => p.key === personKey);
            const dataKey = slot === "day" ? (personKey + "Journee") : personKey;
            const columnName = slot === "day" ? person.columnJournee : person.column;
            const oldVal = item[dataKey];
            const newVal = nextStatus(oldVal);

            // Mise à jour optimiste de l'affichage
            item[dataKey] = newVal;
            renderApp();

            try {
                const url = `${APPS_SCRIPT_URL}?action=updateStatus`
                    + `&row=${item.sheetRow}`
                    + `&personne=${encodeURIComponent(columnName)}`
                    + `&statut=${encodeURIComponent(newVal)}`;
                const resp = await fetch(url);
                const result = await resp.json();

                if (!result.success) {
                    showToast("Erreur d'enregistrement : " + (result.error || "inconnue"), "error");
                    item[dataKey] = oldVal; // on annule le changement local
                    renderApp();
                }
            } catch (err) {
                showToast("Erreur réseau : le statut n'a pas pu être sauvegardé. Nouvelle tentative au prochain chargement.", "error");
                item[dataKey] = oldVal;
                renderApp();
            }
        }

        // ==========================================================
        // VUE CALENDRIER MENSUEL (vraie grille)
        // ==========================================================
        function parseDate(str) {
            if (!str) return null;
            str = str.trim();
            let m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (m) return new Date(parseInt(m[3]), parseInt(m[2]) - 1, parseInt(m[1]));
            m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
            if (m) return new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
            const d = new Date(str);
            return isNaN(d) ? null : d;
        }

        // Rangée de 4 mini-pastilles (une par personne) pour un créneau donné,
        // utilisée dans les cases de la vue calendrier.
        function buildMiniPastilleRow(item, slot) {
            return `
                <div class="mini-pastille-row" aria-hidden="true">
                    ${PEOPLE.map(p => {
                        const dataKey = slot === "day" ? (p.key + "Journee") : p.key;
                        const rawState = item[dataKey] || "";
                        const state = pastilleState(rawState);
                        const content = state === "indispo" ? pastilleCrossSVG(p.color, 9)
                            : state === "enfants" ? pastilleTriangleSVG(p.color, 9)
                            : "";
                        return `<span class="mini-pastille state-${state}" style="--pastille-color:${p.color}">${content}</span>`;
                    }).join("")}
                </div>
            `;
        }

        function renderCalendarView(container) {
            const monthNames = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

            const nav = document.createElement("div");
            nav.className = "card";
            nav.innerHTML = `
                <div class="calendar-nav">
                    <button onclick="changeMonth(-1)">←</button>
                    <span>${monthNames[calMonth]} ${calYear}</span>
                    <button onclick="changeMonth(1)">→</button>
                </div>
                <div class="calendar-grid" id="calendar-grid"></div>
                <div class="calendar-legend">
                    <span><span class="vac-swatch"></span> Vacances zone A + jours fériés</span>
                </div>
            `;
            container.appendChild(nav);

            const detail = document.createElement("div");
            detail.id = "calendar-day-detail";
            container.appendChild(detail);

            const grid = nav.querySelector("#calendar-grid");
            ["Lu","Ma","Me","Je","Ve","Sa","Di"].forEach(d => {
                const h = document.createElement("div");
                h.className = "calendar-day-header";
                h.textContent = d;
                grid.appendChild(h);
            });

            const firstOfMonth = new Date(calYear, calMonth, 1);
            // Lundi = 0 ... Dimanche = 6
            const startOffset = (firstOfMonth.getDay() + 6) % 7;
            const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

            for (let i = 0; i < startOffset; i++) {
                const empty = document.createElement("div");
                empty.className = "calendar-day empty";
                grid.appendChild(empty);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const cellDate = new Date(calYear, calMonth, day);
                const cellIso = isoDateStr_(cellDate);
                const matchIndex = planningData.findIndex(item => {
                    const d = parseDate(item.date);
                    return d && d.getFullYear() === cellDate.getFullYear()
                        && d.getMonth() === cellDate.getMonth()
                        && d.getDate() === cellDate.getDate();
                });

                const ferie = isJourFerie(cellDate);
                const vacances = isVacancesZoneA(cellDate);

                const cell = document.createElement("div");
                let cls = "calendar-day";
                if (matchIndex !== -1) cls += " has-event";
                if (vacances || ferie) cls += " on-vacances";
                if (cellIso === selectedCalendarKey) cls += " selected-day";
                cell.className = cls;
                cell.dataset.iso = cellIso;

                cell.innerHTML = `
                    <div class="day-number-row">
                        <span aria-hidden="true">${day}</span>
                    </div>
                `;

                if (matchIndex !== -1) {
                    const matchItem = planningData[matchIndex];
                    if (hasJourneeSlot(matchItem)) {
                        cell.innerHTML += buildMiniPastilleRow(matchItem, "day");
                        cell.innerHTML += buildMiniPastilleRow(matchItem, "evening");
                    } else {
                        cell.innerHTML += buildMiniPastilleRow(matchItem, "evening");
                    }
                    cell.setAttribute("role", "button");
                    cell.setAttribute("tabindex", "0");
                    const statusText = computeGlobalStatus(matchItem).text;
                    const feriePart = ferie ? ", jour férié" : "";
                    const vacPart = vacances ? ", vacances zone A" : "";
                    cell.setAttribute("aria-label", `${day} ${monthNames[calMonth]} : ${statusText}${feriePart}${vacPart}`);
                    cell.onclick = () => selectCalendarDay(cellIso, matchIndex);
                    cell.onkeydown = (e) => {
                        if (e.key === "Enter" || e.key === " ") {
                            e.preventDefault();
                            selectCalendarDay(cellIso, matchIndex);
                        }
                    };
                } else {
                    if (!ferie && !vacances) cell.setAttribute("aria-hidden", "true");
                }
                grid.appendChild(cell);
            }

            // Si un jour était sélectionné et reste visible ce mois-ci, on
            // réaffiche son détail automatiquement.
            if (selectedCalendarKey) {
                const stillThere = planningData.findIndex(item => {
                    const d = parseDate(item.date);
                    return d && isoDateStr_(d) === selectedCalendarKey;
                });
                if (stillThere !== -1) showDayDetail(stillThere);
            }
        }

        // Sélectionne un jour dans la vue calendrier : le contour reste affiché
        // tant qu'on ne clique pas sur un autre jour (ou change de mois).
        function selectCalendarDay(iso, index) {
            selectedCalendarKey = iso;
            const grid = document.getElementById("calendar-grid");
            if (grid) {
                grid.querySelectorAll(".calendar-day.selected-day").forEach(el => el.classList.remove("selected-day"));
                const cell = grid.querySelector(`[data-iso="${iso}"]`);
                if (cell) cell.classList.add("selected-day");
            }
            showDayDetail(index);
        }

        function showDayDetail(index) {
            const detail = document.getElementById("calendar-day-detail");
            detail.innerHTML = "";
            detail.appendChild(buildCard(planningData[index], index));
        }

        function changeMonth(delta) {
            calMonth += delta;
            if (calMonth < 0) { calMonth = 11; calYear--; }
            if (calMonth > 11) { calMonth = 0; calYear++; }
            renderApp();
        }

        // ==========================================================
        // BOUTON REMONTER EN HAUT
        // ==========================================================
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: "smooth" });
        }
        window.addEventListener("scroll", () => {
            const btn = document.getElementById("scroll-top-btn");
            if (!btn) return;
            btn.style.display = window.scrollY > 300 ? "flex" : "none";
        });

        document.addEventListener("keydown", (e) => {
            if (e.key !== "Escape") return;
            if (document.getElementById("pin-modal").classList.contains("open")) {
                closePinModal();
            } else if (document.getElementById("faq-modal").classList.contains("open")) {
                closeFaqModal();
            } else if (document.getElementById("menu-drawer").classList.contains("open")) {
                closeMenu();
            }
        });

        // ==========================================================
        // PWA : enregistrement du service worker
        // ==========================================================
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("sw.js").catch(() => {
                    // Pas grave si ça échoue (ex: ouverture en local sans serveur) :
                    // l'app fonctionne quand même normalement.
                });
            });
        }

        // ==========================================================
        // INITIALISATION
        // ==========================================================
        buildLoginScreen();

        (function restoreSession() {
            try {
                const savedUser = localStorage.getItem(SESSION_KEY);
                if (savedUser && PEOPLE.some(p => p.display === savedUser)) {
                    login(savedUser);
                }
            } catch (e) {
                // Pas de session à restaurer, on reste sur l'écran de connexion.
            }
        })();
    </script>
</body>
</html>
