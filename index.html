<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le QG des Daronnes</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff9142">
    <link rel="apple-touch-icon" href="logo-qgd.png?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f7f6f4;
            --card-bg: #ffffff;
            --avatar-card-bg: #ffffff;
            --text: #080808;
            --primary: #ff9142;
            --primary-transparent: rgba(255, 145, 66, 0.82);
            --border: #dfe4ea;
            --shadow: rgba(0,0,0,0.05);
        }
        [data-theme="dark"] {
            --bg: #1e1e24;
            --card-bg: #2d2d38;
            --avatar-card-bg: #1e1e24;
            --text: #f1f2f6;
            --primary: #ff9142;
            --primary-transparent: rgba(255, 145, 66, 0.82);
            --border: #3f3f4e;
            --shadow: rgba(0,0,0,0.3);
        }

        * , *::before, *::after {
            box-sizing: border-box;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 12px;
            padding-bottom: 84px;
            transition: background 0.3s, color 0.3s;
        }

        /* Écran de Connexion */
        #login-screen {
            width: min(350px, 100%);
            margin: 40px auto;
            text-align: center;
            background: var(--card-bg);
            padding: 20px 16px;
            border-radius: 16px;
            box-shadow: 0 8px 16px var(--shadow);
        }
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }
        .avatar-card {
            background: var(--avatar-card-bg);
            border: 2px solid var(--border);
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .avatar-card:hover {
            background: var(--avatar-card-bg);
            color: var(--text);
            border-color: var(--avatar-color, var(--primary));
            transform: translateY(-2px);
        }
        .avatar-card:hover .avatar-icon {
            animation: avatar-bob 0.6s ease-in-out infinite;
        }

        /* Icône avatar animée (visage qui cligne des yeux + flotte) */
        .avatar-icon {
            width: 48px;
            height: 48px;
            animation: avatar-float 3s ease-in-out infinite;
        }
        .avatar-icon .eye {
            animation: avatar-blink 4s ease-in-out infinite;
            transform-origin: center;
            transform-box: fill-box;
        }
        @keyframes avatar-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        @keyframes avatar-bob {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-3px) rotate(-3deg); }
        }
        @keyframes avatar-blink {
            0%, 88%, 100% { transform: scaleY(1); }
            92% { transform: scaleY(0.1); }
        }

        /* Icône soleil/lune animée pour le bouton thème */
        .theme-icon {
            position: relative;
            width: 24px;
            height: 24px;
            display: inline-block;
            vertical-align: middle;
        }
        .theme-icon svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transition: opacity 0.4s ease, transform 0.5s ease;
        }
        .icon-sun {
            opacity: 1;
            transform: rotate(0deg) scale(1);
            animation: sun-pulse 3s ease-in-out infinite;
        }
        .icon-moon {
            opacity: 0;
            transform: rotate(-90deg) scale(0.6);
        }
        [data-theme="dark"] .icon-sun {
            opacity: 0;
            transform: rotate(90deg) scale(0.6);
            animation: none;
        }
        [data-theme="dark"] .icon-moon {
            opacity: 1;
            transform: rotate(0deg) scale(1);
            animation: moon-twinkle 2.5s ease-in-out infinite;
        }
        @keyframes sun-pulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.25); }
        }
        @keyframes moon-twinkle {
            0%, 100% { filter: drop-shadow(0 0 0px currentColor); }
            50% { filter: drop-shadow(0 0 3px currentColor); }
        }
        #theme-toggle-btn.spin .theme-icon {
            animation: spin-once 0.5s ease;
        }
        @keyframes spin-once {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Application principale */
        #app-screen {
            display: none;
            width: min(350px, 100%);
            margin: 0 auto;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            position: sticky;
            top: 0;
            background: var(--bg);
            padding: 8px 0;
            z-index: 5;
        }
        .top-bar-title {
            font-weight: bold;
            font-size: 1.25rem;
            color: var(--primary);
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin: 0;
        }
        .top-bar-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .top-bar button {
            flex-shrink: 0;
        }
        .top-bar button {
            background: transparent;
            border: none;
            font-size: 1.3rem;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .top-bar button:hover {
            background: transparent;
            color: var(--primary);
        }

        /* Menu latéral */
        .menu-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 20;
        }
        .menu-overlay.open { display: block; }
        .menu-drawer {
            position: fixed;
            top: 0;
            left: 50%;
            width: min(350px, 100%);
            max-height: 85vh;
            overflow-y: auto;
            background: var(--card-bg);
            box-shadow: 0 10px 24px var(--shadow);
            transform: translate(-50%, -100%);
            transition: transform 0.3s ease;
            z-index: 21;
            padding: 20px;
            box-sizing: border-box;
            border-radius: 0 0 16px 16px;
        }
        .menu-drawer.open { transform: translate(-50%, 0); }
        .menu-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding-bottom: 16px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .menu-header .avatar-icon { width: 36px; height: 36px; margin: 0; }
        .menu-header span { font-weight: bold; }
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            text-align: center;
            background: none;
            border: none;
            padding: 12px 4px;
            font-weight: 600;
            text-decoration: none;
            color: var(--text);
            cursor: pointer;
            box-sizing: border-box;
        }
        .menu-item:hover {
            background: var(--bg);
            color: var(--primary);
            border-radius: 8px;
        }
        .menu-item svg { flex-shrink: 0; }

        /* Barre de navigation du bas */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: min(350px, 100%);
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            border-top: 1px solid var(--border);
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
            z-index: 10;
        }
        .bottom-nav button {
            flex: 1;
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 0.65rem;
            color: var(--text);
            opacity: 0.55;
            padding: 4px 10px;
        }
        .bottom-nav button:hover {
            background: none;
            color: var(--text);
        }
        .bottom-nav button .nav-icon { font-size: 1.3rem; }
        .bottom-nav button svg.nav-icon {
            width: 22px;
            height: 22px;
            display: block;
            margin: 0 auto 2px;
        }
        .bottom-nav button.active-nav {
            opacity: 1;
            color: var(--primary);
        }
        button {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
        }
        button:hover {
            background: var(--primary);
            color: #080808;
            border-color: var(--primary);
        }
        button.active-view {
            background: var(--primary);
            color: #080808;
            border-color: var(--primary);
        }

        /* espace réservé aux vues */

        /* Cartes de soirées */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px var(--shadow);
            border: 1px solid var(--border);
            transition: box-shadow 0.3s, border-color 0.3s;
        }
        .card.highlight-flash {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary);
        }
        .date-header {
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }
        .status-global {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: bold;
        }
        .status-blocked { background: #ffd9d9; color: #a32d2d; }
        .status-pending { background: var(--border); color: var(--text); opacity: 0.8; }
        .status-free-kids { background: #d6ecff; color: #185fa5; }
        .status-free { background: #d7f5e3; color: #0f6e56; }

        /* Boutons ronds des participantes */
        .participants-row {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
            gap: 14px;
        }
        .slot-label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 4px;
        }
        .participant-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75rem;
        }
        .round-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-top: 4px;
            transition: transform 0.1s, opacity 0.2s;
        }
        .round-btn:active {
            transform: scale(0.9);
        }
        .round-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
        .round-btn.saving {
            opacity: 0.5;
        }
        /* Pastilles d'état : la couleur = la personne (fixe, celle de son avatar),
           la FORME/le remplissage = son statut de dispo.
           - Pas répondu : rond gris
           - Dispo : rond coloré (couleur de la personne)
           - Dispo - enfants : triangle coloré (couleur de la personne)
           - Indispo : rond avec une croix de la couleur de la personne */
        .round-btn.state-inconnu { background: var(--border); border-radius: 50%; }
        .round-btn.state-dispo { background: var(--pastille-color, var(--border)); border-radius: 50%; }
        .round-btn.state-enfants { background: transparent; border-radius: 50%; }
        .round-btn.state-indispo { background: transparent; border-radius: 50%; }
        .pastille-cross { display: block; }

        /* Pastilles de PARTICIPATION à une soirée/journée proposée (distinctes
           des pastilles de dispo générale : rond avec un ✓, une ✕ ou un "?") */
        .round-btn.part-inconnu { background: var(--border); border-radius: 50%; }
        .round-btn.part-oui { background: var(--pastille-color, var(--border)); border-radius: 50%; }
        .round-btn.part-non { background: transparent; border-radius: 50%; }
        .participation-row { margin-top: 6px; }

        /* Mini-pastilles utilisées dans la vue calendrier (taille réduite pour
           que les 7 colonnes tiennent toujours sur la largeur de l'écran :
           seul le défilement vertical est nécessaire, jamais horizontal) */
        .mini-pastille-row {
            display: flex;
            gap: 1px;
            justify-content: center;
        }
        .mini-pastille {
            width: 6px;
            height: 6px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mini-pastille.state-inconnu { background: var(--border); border-radius: 50%; }
        .mini-pastille.state-dispo { background: var(--pastille-color, var(--border)); border-radius: 50%; }
        .mini-pastille.state-enfants { background: transparent; border-radius: 50%; overflow: visible; }
        .mini-pastille.state-indispo { background: transparent; border-radius: 50%; overflow: visible; }

        /* Calendrier mensuel */
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .calendar-nav span {
            font-weight: bold;
            text-transform: capitalize;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            overflow-x: hidden;
        }
        .calendar-day-header {
            text-align: center;
            font-size: 0.65rem;
            font-weight: bold;
            color: var(--primary);
            padding-bottom: 4px;
        }
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.8rem;
            position: relative;
            cursor: default;
        }
        .calendar-day {
            aspect-ratio: unset;
            min-height: 58px;
            padding: 3px 1px;
            gap: 2px;
            overflow: hidden;
        }
        .calendar-day.empty {
            border: none;
            min-height: 58px;
        }
        .calendar-day.has-event {
            cursor: pointer;
            border-color: var(--border);
            font-weight: bold;
        }
        .calendar-day.has-event:hover {
            border-color: var(--primary);
        }
        .calendar-day.selected-day {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary);
        }
        .calendar-day .day-number-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }
        .calendar-day .holiday-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--primary);
            flex-shrink: 0;
        }
        #calendar-day-detail {
            margin-top: 16px;
        }
        .calendar-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.68rem;
            opacity: 0.75;
            margin-top: 10px;
            justify-content: center;
        }
        .calendar-legend span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .calendar-legend .holiday-dot {
            width: 6px; height: 6px; border-radius: 50%; background: var(--primary);
        }
        .calendar-day.on-vacances {
            background: rgba(255, 94, 58, 0.07);
        }
        [data-theme="dark"] .calendar-day.on-vacances {
            background: rgba(255, 145, 66, 0.12);
        }
        .calendar-legend .vac-swatch {
            width: 10px; height: 10px; border-radius: 3px; background: rgba(255, 94, 58, 0.2);
        }

        /* Page d'accueil */
        .home-banner {
            position: relative;
            width: 350px;
            height: 200px;
            max-width: 100%;
            border-radius: 16px;
            overflow: hidden;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--primary), #ffb199);
        }
        .home-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .home-banner-scrim {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.2) 55%, rgba(0,0,0,0.05) 100%);
            pointer-events: none;
        }
        .home-greeting {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 10px 14px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #fff;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.7);
            max-width: 95%;
            text-align: center;
            white-space: nowrap;
        }
        .home-greeting .avatar-icon {
            width: 44px;
            height: 44px;
            margin: 0;
            animation: none;
            flex-shrink: 0;
        }
        .overview-label {
            text-transform: uppercase;
            font-size: 0.7rem;
            color: var(--primary);
            font-weight: bold;
            letter-spacing: 0.5px;
            text-align: center;
        }
        .overview-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 4px 0 12px;
        }
        .overview-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }
        .overview-row:last-child { border-bottom: none; }
        .overview-row .day-name { font-weight: bold; }
        .overview-row .day-people { font-size: 0.85rem; opacity: 0.75; margin-top: 2px; }
        .overview-row .chevron { opacity: 0.35; font-size: 1.1rem; }
        .next-available-card {
            text-align: center;
            padding: 18px;
        }
        .next-available-card .label {
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 0.7rem;
        }
        .next-available-card .value {
            font-size: 1.1rem;
            font-weight: bold;
        }
        .whatsapp-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
            color: var(--text);
            font-weight: bold;
            text-decoration: none;
            padding: 10px 16px;
        }

        .btn-orange {
            background: var(--primary);
            color: #080808;
            border-radius: 10px;
            padding: 12px;
            margin-top: 8px;
        }
        .btn-orange:hover {
            background: var(--primary);
            opacity: 0.9;
        }

        /* Interface de chargement */
        .loading-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 70px 20px;
        }
        .pour-anim {
            width: 225px;
            height: 137px;
            transform: translateX(-16px);
        }
        .pour-anim .bottle-group {
            transform-origin: 125px 195px;
            animation: bottle-tilt 6.5s ease-in-out infinite;
        }
        @keyframes bottle-tilt {
            0%, 100% { transform: rotate(34deg); }
            50% { transform: rotate(39deg); }
        }
        .pour-anim .droplet {
            opacity: 0;
            animation: droplet-fall 6.5s ease-in-out infinite;
        }
        .pour-anim .droplet:nth-child(2) { animation-delay: 0.3s; }
        .pour-anim .droplet:nth-child(3) { animation-delay: 0.6s; }
        .pour-anim .droplet:nth-child(4) { animation-delay: 0.9s; }
        .pour-anim .droplet:nth-child(5) { animation-delay: 1.2s; }
        .pour-anim .droplet:nth-child(6) { animation-delay: 1.5s; }
        .pour-anim .droplet:nth-child(7) { animation-delay: 1.8s; }
        .pour-anim .droplet:nth-child(8) { animation-delay: 2.1s; }
        .pour-anim .droplet:nth-child(9) { animation-delay: 2.4s; }
        @keyframes droplet-fall {
            0% { opacity: 0; transform: translate(0, 0); }
            2.46% { opacity: 1; }
            19.69% { opacity: 1; transform: translate(10px, 45px); }
            24.6% { opacity: 0; transform: translate(11px, 47px); }
            100% { opacity: 0; transform: translate(11px, 47px); }
        }
        .pour-anim .liquid-fill {
            animation: liquid-rise 6.5s cubic-bezier(.45,0,.2,1) infinite;
        }
        @keyframes liquid-rise {
            0% { height: 0; y: 182px; opacity: 0; }
            0.5% { opacity: 1; }
            61.538% { height: 26px; y: 156px; opacity: 1; }
            92.308% { height: 26px; y: 156px; opacity: 1; }
            100% { height: 26px; y: 156px; opacity: 0; }
        }
        .loading-text {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            color: var(--text);
            opacity: 0.85;
            text-align: center;
        }

        /* Pop-up de saisie du code PIN */
        .pin-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 30;
        }
        .pin-overlay.open { display: block; }
        .pin-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(280px, 85vw);
            background: var(--card-bg);
            border-radius: 20px;
            padding: 28px 24px;
            box-shadow: 0 16px 32px var(--shadow);
            z-index: 31;

            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            font-size: 0.8rem;
            line-height: 1.5;

        /* Barre de soirée/journée proposée (grise) ou confirmée (segments colorés) */
        .proposal-bar-wrap {
            border-radius: 10px;
            overflow: hidden;
            margin-top: 12px;
            margin-bottom: 10px;
            border: 1px solid var(--border);

            background: #e6f1fb;
            color: #0c447c;

        .sms-link-btn {

        .overview-row:focus-visible,

            outline: 2px solid var(--primary);
            outline-offset: 2px;

        /* Notifications toast (remplacent les alert() du navigateur) */
        .toast-container {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: min(300px, 90vw);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 40;
            pointer-events: none;
        }
        .toast {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            border-radius: 10px;
            padding: 10px 14px;
            box-shadow: 0 6px 16px var(--shadow);
            font-size: 0.85rem;
            color: var(--text);
            animation: toast-in 0.25s ease;
            transition: opacity 0.3s ease;
        }
        .toast.toast-error { border-left-color: #e24b4a; }
        .toast.toast-warn { border-left-color: #eccc68; }
        @keyframes toast-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body data-theme="light">

        async function sendConfirmSlot_(index, slot, motif) {
            const item = planningData[index];
            const field = slot === "day" ? "confirmeeJournee" : "confirmee";
            item[field] = motif;
            // Nouvelle proposition (ou annulation) : on repart de zéro sur les
            // réponses "je viens / je viens pas", indépendamment des dispos.
            resetParticipation_(item, slot);
            renderApp();

            try {
                const baseAction = slot === "day" ? "Journee" : "Soiree";
                const action = (motif ? "confirm" : "unconfirm") + baseAction;
                const url = `${APPS_SCRIPT_URL}?action=${action}&row=${item.sheetRow}&motif=${encodeURIComponent(motif)}`;
                const resp = await fetch(url);
                const result = await resp.json();
                if (!result.success) {

                    await loadPlanning();
                } else if (motif) {

                }

                await loadPlanning();
            }

                let cached = null;
                try {
                    const raw = localStorage.getItem(PLANNING_CACHE_KEY);
                    if (raw) cached = JSON.parse(raw);
                } catch (storageErr) {
                    cached = null;
                }

                if (cached && cached.length > 0) {
                    planningData = cached;
                    renderApp();
                    showToast("Hors-ligne : affichage des dernières données connues.", "warn");
                } else {
                    container.innerHTML = "<p role='alert' style='text-align:center; color:#e24b4a;'>Erreur de chargement du planning.</p>";
                }
            }
        }

        function renderFunStats() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);

            let reunionsCount = 0;
            planningData.forEach(item => {
                const d = parseDate(item.date);
                if (!d || d < monthStart || d > today) return;
                const status = computeGlobalStatus(item);
                if (status.cls === "status-free" || status.cls === "status-free-kids") reunionsCount++;
            });

            const counts = PEOPLE.map(p => ({
                person: p,
                count: planningData.filter(item => (item[p.key] || "").includes("Dispo")).length
            })).sort((a, b) => b.count - a.count);

            let mostAvailableText;
            if (counts.length === 0 || counts[0].count === 0) {
                mostAvailableText = "Pas encore assez de dispos renseignées pour le savoir.";
            } else {
                const topCount = counts[0].count;
                const tied = counts.filter(c => c.count === topCount).map(c => c.person.display);
                mostAvailableText = tied.length > 1
                    ? `${tied.join(" et ")} sont ex æquo, les plus dispo du groupe !`
                    : `${tied[0]} est la plus dispo du groupe !`;
            }

            return `
                <div class="overview-label">PETITES STATS</div>
                <p style="margin:10px 0 6px;">🎉 Vous vous êtes toutes retrouvées <strong>${reunionsCount}</strong> fois ce mois-ci</p>
                <p style="margin:0;">🏆 ${mostAvailableText}</p>
            `;
        }

        function getUpcomingWeekend() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const day = today.getDay(); // 0=Dim ... 6=Sam
            let fridayOffset;
            if (day === 5) fridayOffset = 0;
            else if (day === 6) fridayOffset = -1;
            else if (day === 0) fridayOffset = -2;
            else fridayOffset = 5 - day;

            const friday = new Date(today);
            friday.setDate(today.getDate() + fridayOffset);
            const saturday = new Date(friday); saturday.setDate(friday.getDate() + 1);
            const sunday = new Date(friday); sunday.setDate(friday.getDate() + 2);

            return [
                { label: "Vendredi", date: friday },
                { label: "Samedi", date: saturday },
                { label: "Dimanche", date: sunday }
            ];
        }

        function renderWeekendOverview(target) {
            const weekendDays = getUpcomingWeekend();
            target.innerHTML = "";
            weekendDays.forEach(({ label, date }) => {
                const match = planningData.find(item => {
                    const d = parseDate(item.date);
                    return d && d.getFullYear() === date.getFullYear()
                        && d.getMonth() === date.getMonth()
                        && d.getDate() === date.getDate();
                });

                const isWknd = match ? isWeekendDay(match) : (date.getDay() === 0 || date.getDay() === 6);

                let bodyHtml;
                if (!match) {
                    bodyHtml = `<div class="day-people">Pas encore renseigné</div>`;
                } else if (isWknd) {
                    const journeeNames = PEOPLE.filter(p => (match[p.key + "Journee"] || "").includes("Dispo")).map(p => p.display);
                    const soireeNames = PEOPLE.filter(p => (match[p.key] || "").includes("Dispo")).map(p => p.display);
                    bodyHtml = `
                        <div class="day-people">☀️ Journée : ${journeeNames.length ? journeeNames.join(", ") : "Personne de dispo"}</div>
                        <div class="day-people">🌙 Soirée : ${soireeNames.length ? soireeNames.join(", ") : "Personne de dispo"}</div>
                    `;
                } else {
                    const dispoNames = PEOPLE.filter(p => (match[p.key] || "").includes("Dispo")).map(p => p.display);
                    bodyHtml = `<div class="day-people">Dispo : ${dispoNames.length ? dispoNames.join(", ") : "Personne de dispo"}</div>`;
                }

                const row = document.createElement("div");
                row.className = "overview-row";
                row.setAttribute("role", "button");
                row.setAttribute("tabindex", "0");
                row.innerHTML = `
                    <div>
                        <div class="day-name">${label}</div>
                        ${bodyHtml}
                    </div>
                    <span class="chevron" aria-hidden="true">›</span>
                `;
                row.setAttribute("aria-label", `${label} : ${row.textContent.trim()}`);
                row.onclick = () => goToDate(match, label);
                row.onkeydown = (e) => {
                    if (e.key === "Enter" || e.key === " ") {
                        e.preventDefault();
                        goToDate(match, label);
                    }
                };
                target.appendChild(row);
            });
        }

        function goToDate(match, label) {
            if (!match) {
                showToast(`Le ${label} n'est pas encore renseigné dans le planning.`, "warn");
                return;
            }
            currentView = "list";
            switchTab("liste");
            requestAnimationFrame(() => {
                const card = document.querySelector(`[data-row="${match.sheetRow}"]`);
                if (card) {
                    card.scrollIntoView({ behavior: "smooth", block: "center" });
                    card.classList.add("highlight-flash");

        // Construit un lien sms: pré-rempli pour annoncer qu'une soirée/journée a été proposée
        function buildProposalSmsHref(item, slot) {
            const label = slot === "day" ? "journée" : "soirée";
            const field = slot === "day" ? "confirmeeJournee" : "confirmee";
            const text = `Coucou ! Je propose une ${label} le ${item.jour} ${item.date} (${item[field]}). Va mettre ta dispo sur Le QG des Daronnes : ${APP_URL}`;
            return `sms:?body=${encodeURIComponent(text)}`;
        }

        // Construit une carte "proposée/confirmée" pour CHAQUE soirée/journée à
        // venir (pas seulement la plus proche) — seules les dates déjà passées
        // sont exclues.
        function renderProposedSlotCards(slot) {
            const field = slot === "day" ? "confirmeeJournee" : "confirmee";
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const upcoming = planningData
                .map(item => ({ item, d: parseDate(item.date) }))
                .filter(x => x.d && x.d >= today && x.item[field])
                .sort((a, b) => a.d - b.d);

            return upcoming.map(found => {
                const foundIndex = planningData.indexOf(found.item);
                const status = computeProposalStatus(found.item, slot);
                const label = status === "confirmed"
                    ? (slot === "day" ? "Journée confirmée" : "Soirée confirmée")
                    : (slot === "day" ? "Journée proposée" : "Soirée proposée");
                const isoDate = `${found.d.getFullYear()}-${String(found.d.getMonth() + 1).padStart(2, "0")}-${String(found.d.getDate()).padStart(2, "0")}`;

                const smsBtn = status === "proposed"
                    ? `<a class="sms-link-btn" href="${buildProposalSmsHref(found.item, slot)}" style="margin-top:8px; display:inline-flex;">📱 Envoyer un SMS pour prévenir</a>`
                    : "";

                return `
                    <div class="label">${icon("wine")} ${label}</div>
                    <div class="value">${found.item.jour} ${found.item.date}</div>
                    <div style="margin-top:4px; opacity:0.8;">${found.item[field]}</div>
                    <div class="slot-label" style="margin-top:8px; justify-content:center; color:var(--text); opacity:0.65; text-transform:none; letter-spacing:0;">${icon("wine", 14)} Qui vient ?</div>
                    ${buildParticipationRow(found.item, foundIndex, slot)}
                    <button onclick="openIcsModal('${isoDate}', '${slot}')" style="margin-top:12px;">${icon("calendar", 16)} Ajouter à mon agenda perso</button>
                    <div>${smsBtn}</div>
                `;
            });
        }

        function renderNextAvailable() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const upcoming = planningData
                .map(item => ({ item, d: parseDate(item.date) }))
                .filter(x => x.d && x.d >= today)
                .sort((a, b) => a.d - b.d);

            const found = upcoming.find(x => PEOPLE.every(p => (x.item[p.key] || "").includes("Dispo")));

            if (found) {
                const isoDate = `${found.d.getFullYear()}-${String(found.d.getMonth() + 1).padStart(2, "0")}-${String(found.d.getDate()).padStart(2, "0")}`;
                return `

                    <div class="value">${found.item.jour} ${found.item.date}</div>
                    <button onclick="openIcsModal('${isoDate}')" style="margin-top:12px;">${icon("calendar", 16)} Ajouter à mon agenda perso</button>
                `;
            }
            return `
                <div class="label">${icon("clock")} Pas encore de date en commun</div>
                <div class="value">Continuez à mettre vos dispos à jour !</div>
            `;
        }

        // Échappe les caractères spéciaux pour un champ de fichier .ics
        function icsEscape_(text) {
            return String(text || "")
                .replace(/\\/g, "\\\\")
                .replace(/;/g, "\\;")
                .replace(/,/g, "\\,")
                .replace(/\n/g, "\\n");
        }

        // Génère et télécharge un fichier .ics pour ajouter la soirée à un agenda perso.
        // titreOverride/notesOverride permettent de personnaliser le titre et les notes
        // (saisis via la pop-up ouverte par openIcsModal).
        function downloadEventICS(isoDateStr, slot = "evening", titreOverride, notesOverride) {
            const [y, m, d] = isoDateStr.split("-").map(Number);
            const pad = (n) => String(n).padStart(2, "0");
            const heures = slot === "day" ? ["100000", "180000"] : ["200000", "230000"];
            const dtStart = `${y}${pad(m)}${pad(d)}T${heures[0]}`;
            const dtEnd = `${y}${pad(m)}${pad(d)}T${heures[1]}`;
            const dtStamp = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
            const titre = titreOverride && titreOverride.trim()
                ? titreOverride.trim()
                : (slot === "day" ? "☀️ Journée QG des Daronnes" : "🍷 Soirée QG des Daronnes");
            const notes = notesOverride !== undefined ? notesOverride.trim() : "Moment entre daronnes";

            const ics = [
                "BEGIN:VCALENDAR",
                "VERSION:2.0",
                "PRODID:-//QG des Daronnes//FR",
                "BEGIN:VEVENT",
                `UID:qgd-${slot}-${isoDateStr}-${Date.now()}@qgdaronnes`,
                `DTSTAMP:${dtStamp}`,
                `DTSTART:${dtStart}`,
                `DTEND:${dtEnd}`,
                `SUMMARY:${icsEscape_(titre)}`,
                `DESCRIPTION:${icsEscape_(notes)}`,
                "END:VEVENT",
                "END:VCALENDAR"
            ].join("\r\n");

            const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `soiree-qgd-${isoDateStr}.ics`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("Événement téléchargé, ouvre-le pour l'ajouter à ton agenda.");
        }

        // ==========================================================
        // POP-UP "AJOUTER A MON AGENDA" (personnalisation titre/notes)
        // ==========================================================
        let pendingIcs = null;
        let icsTriggerEl = null;

        function openIcsModal(isoDateStr, slot = "evening") {
            pendingIcs = { isoDateStr, slot };
            icsTriggerEl = document.activeElement;

            const item = planningData.find(p => {
                const d = parseDate(p.date);
                return d && isoDateStr_(d) === isoDateStr;
            });
            const field = slot === "day" ? "confirmeeJournee" : "confirmee";
            const motif = item ? (item[field] || "") : "";
            const defaultTitle = slot === "day" ? "☀️ Journée QG des Daronnes" : "🍷 Soirée QG des Daronnes";
            const titleWithMotif = motif ? `${defaultTitle} — ${motif}` : defaultTitle;

            document.getElementById("ics-title-input").value = titleWithMotif;
            document.getElementById("ics-notes-input").value = "Moment entre daronnes";
            document.getElementById("ics-overlay").classList.add("open");
            document.getElementById("ics-modal").classList.add("open");
            setTimeout(() => document.getElementById("ics-title-input").focus(), 50);
        }

        function closeIcsModal() {
            document.getElementById("ics-overlay").classList.remove("open");
            document.getElementById("ics-modal").classList.remove("open");
            pendingIcs = null;
            const elToFocus = icsTriggerEl;
            icsTriggerEl = null;
            if (elToFocus) setTimeout(() => elToFocus.focus(), 0);
        }

        function submitIcsDownload() {
            if (!pendingIcs) return;
            const titre = document.getElementById("ics-title-input").value;
            const notes = document.getElementById("ics-notes-input").value;
            const { isoDateStr, slot } = pendingIcs;
            closeIcsModal();
            downloadEventICS(isoDateStr, slot, titre, notes);
        }

        ];
        const CUSTOM_IDEAS_KEY = "qgd_custom_ideas_v1";

        function getCustomIdeas() {

                return [];
            }

        function saveCustomIdeas(list) {
            try {
                localStorage.setItem(CUSTOM_IDEAS_KEY, JSON.stringify(list));
            } catch (e) {

        function renderCustomIdeasList() {
            const listEl = document.getElementById("custom-ideas-list");
            if (!listEl) return;
            const customIdeas = getCustomIdeas();
            if (customIdeas.length === 0) {
                listEl.innerHTML = `<p style="font-size:0.8rem; opacity:0.6; margin:0;">Aucune idée ajoutée pour l'instant.</p>`;

            }
            listEl.innerHTML = customIdeas.map((idea, i) => `

        function addCustomIdea() {
            const input = document.getElementById("new-idea-input");
            const value = input.value.trim();
            if (!value) return;
            const customIdeas = getCustomIdeas();
            customIdeas.push(value);
            saveCustomIdeas(customIdeas);
            input.value = "";
            renderCustomIdeasList();
            showToast("Idée ajoutée !");

        function removeCustomIdea(index) {
            const customIdeas = getCustomIdeas();
            customIdeas.splice(index, 1);
            saveCustomIdeas(customIdeas);
            renderCustomIdeasList();

        function tirerIdee() {
            const resultEl = document.getElementById("idee-result");
            const pool = getAllIdeas();
            let count = 0;
            const spin = setInterval(() => {
                resultEl.textContent = pool[Math.floor(Math.random() * pool.length)];
                count++;
                if (count > 10) {
                    clearInterval(spin);
                    // Évite de retomber deux fois de suite sur la même idée (si le pool le permet)
                    let finalPick = pool[Math.floor(Math.random() * pool.length)];
                    let attempts = 0;
                    while (finalPick === lastIdeaDrawn && pool.length > 1 && attempts < 10) {
                        finalPick = pool[Math.floor(Math.random() * pool.length)];
                        attempts++;
                    }
                    lastIdeaDrawn = finalPick;
                    resultEl.textContent = finalPick;
                }
            }, 80);
        }

                searchWrap.querySelector("#calendar-search").onkeydown = (e) => {
